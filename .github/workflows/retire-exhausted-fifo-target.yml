name: Retire exhausted GENERAL FIFO target

on:
  push:
    branches:
      - main
    paths:
      - ops/retire-fifo-target-2026-11-10.json

permissions:
  contents: write

concurrency:
  group: general-automation-state-maintenance
  cancel-in-progress: false

jobs:
  retire-exhausted-target:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the one-time operation request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "operation": "RETIRE_EXHAUSTED_FIFO_TARGET",
              "target_date": "2026-11-10",
              "archive_sha256": "ae7b79e4922d4178a86c7d7880af3e4758d1a5e7f78d6cc3d2595fbb4fd66596",
              "archive_record_count": 983,
              "expected_attempt_count": 5,
              "expected_next_target_date": "2026-11-12",
              "expected_next_archive_sha256": "e85b8b5de47355b83f2c070f9ffbfe8dc97541ec52b93a849c3e285f776d781e",
              "expected_next_archive_record_count": 984,
          }
          actual = json.loads(Path("ops/retire-fifo-target-2026-11-10.json").read_text(encoding="utf-8"))
          if actual != expected:
              raise SystemExit("One-time FIFO retirement request does not match the approved target identity.")
          print("Exact one-time retirement request validated; no provider call is permitted by this workflow.")

      - name: Hydrate authoritative automation state (read-only)
        id: hydrate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 general_automation_state_writer.py hydrate \
            --workspace "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retire only the exhausted FIFO head
        id: retire
        run: |
          python3 general_autonomous_research.py retire-exhausted-target \
            --state general_autonomous_research_state.json \
            --target-date 2026-11-10 \
            --archive-sha256 ae7b79e4922d4178a86c7d7880af3e4758d1a5e7f78d6cc3d2595fbb4fd66596 \
            --archive-record-count 983 \
            --expected-attempt-count 5 \
            --expected-next-target-date 2026-11-12 \
            --expected-next-archive-sha256 e85b8b5de47355b83f2c070f9ffbfe8dc97541ec52b93a849c3e285f776d781e \
            --expected-next-archive-record-count 984

      - name: Publish one atomic authoritative state update
        uses: ./.github/actions/publish-automation-state
        with:
          token: ${{ github.token }}
          expected_generation: ${{ steps.hydrate.outputs.state_generation }}
          objects: autonomous_research_state
          message: "Retire exhausted 2026-11-10 FIFO target"

      - name: Re-hydrate and verify the authoritative result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 general_automation_state_writer.py hydrate \
            --workspace /tmp/verified-state \
            --github-output "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("/tmp/verified-state/general_autonomous_research_state.json").read_text(encoding="utf-8"))
          queue = state["target_queue"]
          retired = [
              item for item in queue["completed"]
              if item["target_date"] == "2026-11-10"
              and item["outcome"] == "EXHAUSTED_RETRY_BUDGET"
          ]
          attempts = [item for item in state["attempts"] if item["target_date"] == "2026-11-10"]
          event_by_attempt = {item["attempt_id"]: item for item in state["events"]}
          if len(retired) != 1 or len(attempts) != 5:
              raise SystemExit("Authoritative state does not show exactly one exhausted target and five preserved attempts.")
          if any(event_by_attempt.get(item["attempt_id"], {}).get("outcome") != "FAILED" for item in attempts):
              raise SystemExit("A historical attempt was changed or lacks its original FAILED event.")
          if not queue["items"] or queue["items"][0]["target_date"] != "2026-11-12":
              raise SystemExit("The expected 2026-11-12 target is not the FIFO head.")
          print(json.dumps({
              "status": "VERIFIED",
              "retired_target": "2026-11-10",
              "outcome": "EXHAUSTED_RETRY_BUDGET",
              "preserved_attempts": len(attempts),
              "next_fifo_target": queue["items"][0]["target_date"],
              "nvidia_requests": 0,
          }, sort_keys=True))
          PY
