name: Retire exhausted GENERAL active target

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Exact date of the current active target.
        required: true
        type: string
      archive_sha256:
        description: Exact immutable active-target snapshot SHA-256.
        required: true
        type: string
      archive_record_count:
        description: Exact FIFO snapshot record count.
        required: true
        type: number
      expected_attempt_count:
        description: Exact number of recorded attempts.
        required: true
        type: number
      expected_next_target_date:
        description: Exact date of the staged latest archive snapshot that should follow retirement.
        required: true
        type: string
      expected_next_archive_sha256:
        description: Exact SHA-256 of the staged latest archive snapshot.
        required: true
        type: string
      expected_next_archive_record_count:
        description: Exact record count of the next FIFO snapshot.
        required: true
        type: number
      confirmation:
        description: Exact manual confirmation required for this state-store write.
        required: true
        type: string
        default: "NO"

permissions:
  contents: write

concurrency:
  group: general-automation-state-maintenance
  cancel-in-progress: false

jobs:
  reject-unapproved-dispatch:
    if: ${{ github.ref != 'refs/heads/main' || inputs.confirmation != 'I_CONFIRM_EXHAUSTED_FIFO_TARGET_RETIREMENT' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse the unapproved operation
        run: |
          echo "Dispatch must run from main and include the exact retirement confirmation."
          exit 1

  retire-exhausted-target:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'I_CONFIRM_EXHAUSTED_FIFO_TARGET_RETIREMENT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the exact retirement request
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          ARCHIVE_RECORD_COUNT: ${{ inputs.archive_record_count }}
          EXPECTED_ATTEMPT_COUNT: ${{ inputs.expected_attempt_count }}
          NEXT_TARGET_DATE: ${{ inputs.expected_next_target_date }}
          NEXT_ARCHIVE_SHA256: ${{ inputs.expected_next_archive_sha256 }}
          NEXT_ARCHIVE_RECORD_COUNT: ${{ inputs.expected_next_archive_record_count }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from datetime import date

          def exact_date(name):
              value = os.environ[name]
              try:
                  parsed = date.fromisoformat(value)
              except ValueError:
                  raise SystemExit(name + " must be an ISO date.")
              if parsed.isoformat() != value:
                  raise SystemExit(name + " must use canonical YYYY-MM-DD.")
              return value

          def exact_int(name, minimum=1):
              raw = os.environ[name]
              if not re.fullmatch(r"[0-9]+", raw):
                  raise SystemExit(name + " must be a positive integer.")
              value = int(raw)
              if value < minimum:
                  raise SystemExit(name + " is below its minimum.")
              return value

          def exact_sha(name):
              value = os.environ[name]
              if not re.fullmatch(r"[0-9a-f]{64}", value):
                  raise SystemExit(name + " must be a lowercase SHA-256.")
              return value

          exact_date("TARGET_DATE")
          exact_date("NEXT_TARGET_DATE")
          exact_sha("ARCHIVE_SHA256")
          exact_sha("NEXT_ARCHIVE_SHA256")
          exact_int("ARCHIVE_RECORD_COUNT")
          attempts = exact_int("EXPECTED_ATTEMPT_COUNT", 10)
          if attempts != 10:
              raise SystemExit("Exhaustion retirement requires exactly ten failed attempts.")
          exact_int("NEXT_ARCHIVE_RECORD_COUNT")
          print("Request identity and field formats validated. No provider call is permitted.")
          PY

      - name: Hydrate the authoritative state snapshot
        id: hydrate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 general_automation_state_writer.py hydrate \
            --workspace "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Capture immutable attempt and event history
        id: baseline
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("general_autonomous_research_state.json").read_text(encoding="utf-8"))
          target = os.environ["TARGET_DATE"]
          attempts = [item for item in state["attempts"] if item["target_date"] == target]
          ids = {item["attempt_id"] for item in attempts}
          events = [item for item in state["events"] if item["attempt_id"] in ids]
          canonical = lambda value: json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("attempts_sha256=" + hashlib.sha256(canonical(attempts)).hexdigest() + "\n")
              output.write("events_sha256=" + hashlib.sha256(canonical(events)).hexdigest() + "\n")
              output.write("attempt_count=" + str(len(attempts)) + "\n")
          print("Captured target attempt/event digests without exposing draw values.")
          PY

      - name: Retire only the exact exhausted active target
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          ARCHIVE_RECORD_COUNT: ${{ inputs.archive_record_count }}
          EXPECTED_ATTEMPT_COUNT: ${{ inputs.expected_attempt_count }}
          NEXT_TARGET_DATE: ${{ inputs.expected_next_target_date }}
          NEXT_ARCHIVE_SHA256: ${{ inputs.expected_next_archive_sha256 }}
          NEXT_ARCHIVE_RECORD_COUNT: ${{ inputs.expected_next_archive_record_count }}
        run: |
          python3 general_autonomous_research.py retire-exhausted-target \
            --state general_autonomous_research_state.json \
            --target-date "$TARGET_DATE" \
            --archive-sha256 "$ARCHIVE_SHA256" \
            --archive-record-count "$ARCHIVE_RECORD_COUNT" \
            --expected-attempt-count "$EXPECTED_ATTEMPT_COUNT" \
            --expected-next-target-date "$NEXT_TARGET_DATE" \
            --expected-next-archive-sha256 "$NEXT_ARCHIVE_SHA256" \
            --expected-next-archive-record-count "$NEXT_ARCHIVE_RECORD_COUNT"

      - name: Publish the single guarded state-store update
        uses: ./.github/actions/publish-automation-state
        with:
          token: ${{ github.token }}
          expected_generation: ${{ steps.hydrate.outputs.state_generation }}
          objects: autonomous_research_state
          message: "Record explicit exhausted active-target retirement"

      - name: Re-hydrate and verify the authoritative result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_DATE: ${{ inputs.target_date }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          ARCHIVE_RECORD_COUNT: ${{ inputs.archive_record_count }}
          EXPECTED_ATTEMPT_COUNT: ${{ inputs.expected_attempt_count }}
          NEXT_TARGET_DATE: ${{ inputs.expected_next_target_date }}
          NEXT_ARCHIVE_SHA256: ${{ inputs.expected_next_archive_sha256 }}
          NEXT_ARCHIVE_RECORD_COUNT: ${{ inputs.expected_next_archive_record_count }}
          ATTEMPTS_SHA256: ${{ steps.baseline.outputs.attempts_sha256 }}
          EVENTS_SHA256: ${{ steps.baseline.outputs.events_sha256 }}
        run: |
          python3 general_automation_state_writer.py hydrate \
            --workspace /tmp/verified-state \
            --github-output "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("/tmp/verified-state/general_autonomous_research_state.json").read_text(encoding="utf-8"))
          queue = state["target_queue"]
          target = os.environ["TARGET_DATE"]
          archive_sha = os.environ["ARCHIVE_SHA256"]
          record_count = int(os.environ["ARCHIVE_RECORD_COUNT"])
          expected_attempts = int(os.environ["EXPECTED_ATTEMPT_COUNT"])
          next_target = os.environ["NEXT_TARGET_DATE"]
          next_sha = os.environ["NEXT_ARCHIVE_SHA256"]
          next_count = int(os.environ["NEXT_ARCHIVE_RECORD_COUNT"])

          retired = [
              item for item in queue["completed"]
              if item["target_date"] == target
              and item["archive_sha256"] == archive_sha
              and item["archive_record_count"] == record_count
              and item["outcome"] == "EXHAUSTED_RETRY_BUDGET"
          ]
          attempts = [item for item in state["attempts"] if item["target_date"] == target]
          attempt_ids = {item["attempt_id"] for item in attempts}
          events = [item for item in state["events"] if item["attempt_id"] in attempt_ids]
          event_by_attempt = {item["attempt_id"]: item for item in events}
          canonical = lambda value: json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8")

          if len(retired) != 1 or len(attempts) != expected_attempts:
              raise SystemExit("Authoritative state does not contain the exact exhausted target and attempt count.")
          if any(item["archive_sha256"] != archive_sha or item["archive_record_count"] != record_count for item in attempts):
              raise SystemExit("An archived attempt identity changed.")
          if len(events) != expected_attempts or any(event_by_attempt.get(item["attempt_id"], {}).get("outcome") != "FAILED" for item in attempts):
              raise SystemExit("Every preserved target attempt must still have its original FAILED event.")
          if queue.get("schema_version") == 2:
              if queue.get("active") is not None:
                  raise SystemExit("The exhausted active target was not released.")
              staged = queue.get("latest_snapshot")
              if not isinstance(staged, dict) or staged.get("target_date") != next_target or staged.get("archive_sha256") != next_sha or staged.get("archive_record_count") != next_count:
                  raise SystemExit("The exact expected successor is not the staged latest archive snapshot.")
          elif queue.get("schema_version") == 1:
              items = queue.get("items")
              if not items or items[0].get("target_date") != next_target or items[0].get("archive_sha256") != next_sha or items[0].get("archive_record_count") != next_count:
                  raise SystemExit("The exact expected successor is not the legacy FIFO head.")
          else:
              raise SystemExit("Unsupported target queue schema after retirement.")
          if hashlib.sha256(canonical(attempts)).hexdigest() != os.environ["ATTEMPTS_SHA256"]:
              raise SystemExit("Target attempt history changed during retirement.")
          if hashlib.sha256(canonical(events)).hexdigest() != os.environ["EVENTS_SHA256"]:
              raise SystemExit("Target event history changed during retirement.")
          print(json.dumps({
              "status": "VERIFIED",
              "outcome": "EXHAUSTED_RETRY_BUDGET",
              "preserved_attempts": len(attempts),
              "staged_latest_target": next_target,
              "nvidia_requests": 0,
              "lock_changes": 0,
              "target_values_rendered": False,
          }, sort_keys=True))
          PY
