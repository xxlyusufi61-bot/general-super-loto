name: GENERAL Offline Discovery CI

'on':
  workflow_dispatch:
  push:
    paths:
      - "general_offline_hypothesis_discovery.py"
      - "general_offline_hypothesis_discovery_test.py"
      - "general_method_registry.json"
      - "general_method_registry_test.py"
      - "general_hypothesis_execution.py"
      - "general_hypothesis_proposals.py"
      - "general_sealed_evaluation.py"
      - "general_data_guard.py"
      - "general_hypothesis_execution_v2.py"
      - "general_bidirectional_evaluation.py"
      - "general_execution_spec_dispatch.py"
      - "general_execution_spec_parser.py"
      - "general_research_memory.py"
      - "telegram_report.py"
      - "general_autonomous_research.py"
      - "general_autonomous_research_test.py"
      - "general_continuous_research.py"
      - "general_continuous_research_test.py"
      - "general_research_windows.py"
      - "general_research_windows_test.py"
      - "general_sealed_evaluation_test.py"
      - "general_sealed_evaluation_v3_test.py"
      - "general_research_memory_test.py"
      - "general_target_admission.py"
      - "general_target_admission_test.py"
      - "general_target_evaluator.py"
      - "general_target_evaluator_test.py"
      - "general_target_evaluation_ledger.py"
      - "general_target_queue.py"
      - "general_nvidia_guard.py"
      - "general_automation_state_writer.py"
      - ".github/workflows/general-autonomous-research.yml"
      - "docs/continuous-research-loop.md"
      - "docs/sealed-evaluation-orchestration.md"
      - ".github/workflows/general-offline-discovery-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "general_offline_hypothesis_discovery.py"
      - "general_offline_hypothesis_discovery_test.py"
      - "general_method_registry.json"
      - "general_method_registry_test.py"
      - "general_hypothesis_execution.py"
      - "general_hypothesis_proposals.py"
      - "general_sealed_evaluation.py"
      - "general_data_guard.py"
      - "general_hypothesis_execution_v2.py"
      - "general_bidirectional_evaluation.py"
      - "general_execution_spec_dispatch.py"
      - "general_execution_spec_parser.py"
      - "general_research_memory.py"
      - "telegram_report.py"
      - "general_autonomous_research.py"
      - "general_autonomous_research_test.py"
      - "general_continuous_research.py"
      - "general_continuous_research_test.py"
      - "general_research_windows.py"
      - "general_research_windows_test.py"
      - "general_sealed_evaluation_test.py"
      - "general_sealed_evaluation_v3_test.py"
      - "general_research_memory_test.py"
      - "general_target_admission.py"
      - "general_target_admission_test.py"
      - "general_target_evaluator.py"
      - "general_target_evaluator_test.py"
      - "general_target_evaluation_ledger.py"
      - "general_target_queue.py"
      - "general_nvidia_guard.py"
      - "general_automation_state_writer.py"
      - ".github/workflows/general-autonomous-research.yml"
      - "docs/continuous-research-loop.md"
      - "docs/sealed-evaluation-orchestration.md"
      - ".github/workflows/general-offline-discovery-test.yml"

permissions:
  contents: read

jobs:
  offline-discovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile offline discovery modules
        run: |
          python3 -m py_compile \
            general_offline_hypothesis_discovery.py \
            general_offline_hypothesis_discovery_test.py \
            general_method_registry_test.py \
            general_hypothesis_execution.py \
            general_hypothesis_proposals.py \
            general_sealed_evaluation.py \
            general_data_guard.py \
            general_hypothesis_execution_v2.py \
            general_bidirectional_evaluation.py \
            general_execution_spec_dispatch.py \
            general_execution_spec_parser.py \
            general_research_memory.py \
            telegram_report.py \
            general_research_windows.py \
            general_research_windows_test.py \
            general_sealed_evaluation_test.py \
            general_sealed_evaluation_v3_test.py \
            general_research_memory_test.py \
            general_autonomous_research.py \
            general_autonomous_research_test.py \
            general_continuous_research.py \
            general_continuous_research_test.py \
            general_target_admission.py \
            general_target_admission_test.py \
            general_target_evaluator.py \
            general_target_evaluator_test.py \
            general_target_evaluation_ledger.py \
            general_target_queue.py \
            general_nvidia_guard.py \
            general_automation_state_writer.py

      - name: Run offline discovery, V3 package, and orchestration regressions
        run: |
          python3 -m unittest -v \
            general_offline_hypothesis_discovery_test \
            general_method_registry_test \
            general_research_windows_test \
            general_sealed_evaluation_test \
            general_sealed_evaluation_v3_test \
            general_research_memory_test \
            general_autonomous_research_test \
            general_continuous_research_test \
            general_target_admission_test \
            general_target_evaluator_test
