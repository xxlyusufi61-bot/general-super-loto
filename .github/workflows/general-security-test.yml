name: GENERAL Security Test

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - "general_core.py"
      - "general_agent_report_guard.py"
      - "general_agent_report_guard_test.py"
      - "general_live_consent.py"
      - "general_data_guard.py"
      - "general_memory.py"
      - "general_memory.json"
      - "general_core_security_test.py"
      - "general_core_live_consent_test.py"
      - "super_loto_archive.json"
      - ".github/workflows/general-security-test.yml"
  push:
    paths:
      - "general_core.py"
      - "general_agent_report_guard.py"
      - "general_agent_report_guard_test.py"
      - "general_live_consent.py"
      - "general_data_guard.py"
      - "general_memory.py"
      - "general_memory.json"
      - "general_core_security_test.py"
      - "general_core_live_consent_test.py"
      - "super_loto_archive.json"
      - ".github/workflows/general-security-test.yml"

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get GENERAL source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required files
        run: |
          test -f general_core.py
          test -f general_agent_report_guard.py
          test -f general_agent_report_guard_test.py
          test -f general_data_guard.py
          test -f general_core.py
          test -f general_agent_report_guard.py
          test -f general_agent_report_guard_test.py
          test -f general_core_security_test.py
          test -f super_loto_archive.json
          echo "Required files: PASS"

      - name: Run security test without real NVIDIA API calls
        run: |
          python3 -m unittest -v general_core_live_consent_test general_agent_report_guard_test
          python3 general_core_security_test.py
