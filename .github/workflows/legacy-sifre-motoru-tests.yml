name: Legacy Sifre Motoru Synthetic Audit Tests

'on':
  pull_request:
    paths:
      - 'legacy_sources/Super_Loto_Sifre_Kesif_Motoru_v1_2.py'
      - 'test_legacy_sifre_motoru_v1_2_audit.py'
      - '.github/workflows/legacy-sifre-motoru-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'legacy_sources/Super_Loto_Sifre_Kesif_Motoru_v1_2.py'
      - 'test_legacy_sifre_motoru_v1_2_audit.py'
      - '.github/workflows/legacy-sifre-motoru-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile without running the legacy search
        run: |
          python -m py_compile legacy_sources/Super_Loto_Sifre_Kesif_Motoru_v1_2.py test_legacy_sifre_motoru_v1_2_audit.py

      - name: Run synthetic-only audit tests
        run: python -m unittest -v test_legacy_sifre_motoru_v1_2_audit.py
