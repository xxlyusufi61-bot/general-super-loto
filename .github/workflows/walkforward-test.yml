name: GENERAL Walk-Forward Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "general_walkforward.py"
      - "general_walkforward_test.py"
      - "general_data_guard.py"
      - "super_loto_archive.json"
      - ".github/workflows/walkforward-test.yml"
  pull_request:
    paths:
      - "general_walkforward.py"
      - "general_walkforward_test.py"
      - "general_data_guard.py"
      - "super_loto_archive.json"
      - ".github/workflows/walkforward-test.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hydrate verified GENERAL state-store data
        id: state_bootstrap
        uses: ./.github/actions/hydrate-automation-state
        with:
          token: ${{ github.token }}
      - name: Verify active state-store authority and global safety lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 general_automation_state_integrity_audit.py
      - name: Compile modules
        run: python -m py_compile general_walkforward.py general_walkforward_test.py general_data_guard.py
      - name: Run synthetic unit tests (no real archive or target draw)
        run: python -m unittest -v general_walkforward_test
      - name: Run offline baseline against committed canonical archive
        run: >-
          python -B general_walkforward.py
          --archive super_loto_archive.json
          --min-train 100
          --folds 5
