name: GENERAL Autonomous Research Scheduler Tests

'on':
  push:
    paths:
      - "general_autonomous_research.py"
      - "general_autonomous_research_test.py"
      - "general_autonomous_research_state.json"
      - "telegram_report.py"
      - "telegram_report_test.py"
      - ".github/workflows/general-autonomous-research.yml"
      - ".github/workflows/general-autonomous-research-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "general_autonomous_research.py"
      - "general_autonomous_research_test.py"
      - "general_autonomous_research_state.json"
      - "telegram_report.py"
      - "telegram_report_test.py"
      - ".github/workflows/general-autonomous-research.yml"
      - ".github/workflows/general-autonomous-research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous-scheduler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile autonomous scheduler, tests, and report formatter
        run: |
          python3 -m py_compile \
            general_autonomous_research.py \
            general_autonomous_research_test.py \
            telegram_report.py \
            telegram_report_test.py
      - name: Run autonomous scheduler and Telegram formatter tests
        run: |
          python3 -m unittest -v \
            general_autonomous_research_test \
            telegram_report_test
      - name: Parse the scheduled workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/general-autonomous-research.yml"); puts "YAML syntax: PASS"'
