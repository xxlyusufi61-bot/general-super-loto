name: GENERAL Coordinator Workflow Syntax Tests

on:
  push:
    paths:
      - ".github/workflows/general-agent.yml"
      - "general_agent_workflow_guard_test.py"
      - "general_core_live_consent_test.py"
      - "general_live_consent.py"
      - "general_open_research_test.py"
      - "general_open_research.py"
      - ".github/workflows/open-research.yml"
      - ".github/workflows/nvidia-chat-test.yml"
      - ".github/workflows/nvidia-test.yml"
      - "general_core_output_safety_test.py"
      - ".github/workflows/general-coordinator-execute.yml"
      - ".github/workflows/rule-change-approval.yml"
      - "general_rule_change.py"
      - "general_rule_change_test.py"
      - "general_memory_pr_guard.py"
      - "general_memory_pr_guard_test.py"
      - "general_core_registry_test.py"
      - "general_walkforward.py"
      - "general_walkforward_test.py"
      - ".github/workflows/general-coordinator-workflow-syntax-test.yml"
      - "general_coordinator.py"
      - "general_coordinator_test.py"
      - "general_core.py"
      - "general_agent_report_guard.py"
      - "general_agent_report_guard_test.py"
      - "general_source_context.py"
      - "general_coordinator_memory_publication.py"
      - "general_coordinator_memory_publication_test.py"
  pull_request:
    paths:
      - ".github/workflows/general-agent.yml"
      - "general_agent_workflow_guard_test.py"
      - "general_core_live_consent_test.py"
      - "general_live_consent.py"
      - "general_open_research_test.py"
      - "general_open_research.py"
      - ".github/workflows/open-research.yml"
      - ".github/workflows/nvidia-chat-test.yml"
      - ".github/workflows/nvidia-test.yml"
      - "general_core_output_safety_test.py"
      - ".github/workflows/general-coordinator-execute.yml"
      - ".github/workflows/rule-change-approval.yml"
      - "general_rule_change.py"
      - "general_rule_change_test.py"
      - "general_memory_pr_guard.py"
      - "general_memory_pr_guard_test.py"
      - "general_core_registry_test.py"
      - "general_walkforward.py"
      - "general_walkforward_test.py"
      - ".github/workflows/general-coordinator-workflow-syntax-test.yml"
      - "general_coordinator.py"
      - "general_coordinator_test.py"
      - "general_core.py"
      - "general_agent_report_guard.py"
      - "general_agent_report_guard_test.py"
      - "general_source_context.py"
      - "general_coordinator_memory_publication.py"
      - "general_coordinator_memory_publication_test.py"

permissions:
  contents: read

jobs:
  syntax-and-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Parse coordinator workflow YAML
        run: |
          ruby -e 'require "yaml"; %w[.github/workflows/general-agent.yml .github/workflows/nvidia-test.yml .github/workflows/nvidia-chat-test.yml .github/workflows/open-research.yml .github/workflows/general-coordinator-execute.yml .github/workflows/rule-change-approval.yml].each { |path| YAML.parse_file(path) }'
          echo "GENERAL live-request workflow YAML syntax: PASS"

      - name: Compile coordinator modules
        run: |
          python3 -m py_compile general_live_consent.py general_core.py general_agent_report_guard.py general_agent_report_guard_test.py general_coordinator.py general_source_context.py general_open_research.py general_coordinator_memory_publication.py general_core_output_safety_test.py general_agent_workflow_guard_test.py general_core_live_consent_test.py general_rule_change.py general_rule_change_test.py general_memory_pr_guard.py general_core_registry_test.py general_walkforward.py general_walkforward_test.py

      - name: Run mock-only coordinator and explicit-consent tests
        run: python3 -m unittest -v general_coordinator_test general_memory_pr_guard_test general_coordinator_memory_publication_test general_core_output_safety_test general_agent_report_guard_test general_agent_workflow_guard_test general_core_live_consent_test general_open_research_test general_rule_change_test general_core_registry_test general_walkforward_test
