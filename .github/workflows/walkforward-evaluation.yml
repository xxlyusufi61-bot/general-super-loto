name: GENERAL Walk-Forward Evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - "general_walkforward.py"
      - "general_archive_fetch.py"
      - "general_archive_cross_source_audit.py"
      - "general_data_guard.py"
      - ".github/workflows/walkforward-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh archive without printing draw details
        run: |
          if python3 general_archive_fetch.py > archive_fetch_output.log 2>&1; then
            echo "ARCHIVE FETCH: completed; parser details suppressed."
          else
            safe_category="$(grep -oE 'ARCHIVE FETCH FAILED \[[A-Z_]+\]' archive_fetch_output.log | tail -n 1 || true)"
            if [ -n "$safe_category" ]; then
              echo "$safe_category; details suppressed."
            else
              echo "ARCHIVE FETCH FAILED [UNKNOWN]; details suppressed."
            fi
            exit 1
          fi

      - name: Validate archive and target isolation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import general_data_guard as guard

          path = Path("super_loto_archive.json")
          if not path.is_file():
              raise SystemExit("ARCHIVE CHECK FAILED: archive missing")

          payload = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or not isinstance(payload.get("draws"), list):
              raise SystemExit("ARCHIVE CHECK FAILED: unexpected archive structure")

          rows = payload["draws"]
          checked = guard.validate_archive(rows)
          target_date = checked.get("last_date")
          if not isinstance(target_date, str):
              raise SystemExit("ISOLATION CHECK FAILED: latest target date missing")

          split = guard.isolate_target(rows, target_date)
          if split.get("isolation_pass") is not True:
              raise SystemExit("ISOLATION CHECK FAILED: Data Guard did not pass")
          if split.get("target_present_in_archive") is not True:
              raise SystemExit("ISOLATION CHECK FAILED: latest target missing")
          if split.get("excluded_dates") != [target_date]:
              raise SystemExit("ISOLATION CHECK FAILED: target exclusion mismatch")
          train = split.get("train")
          if not isinstance(train, list) or len(train) != len(rows) - 1:
              raise SystemExit("ISOLATION CHECK FAILED: training count mismatch")
          if any(row["date"] >= target_date for row in train):
              raise SystemExit("ISOLATION CHECK FAILED: target/future date in training")

          print("DATA GUARD: PASS")
          print("TARGET ISOLATION: PASS")
          print("Archive records:", checked["record_count"])
          print("Pre-target training records:", len(train))
          print("Dynamic target date:", target_date)
          print("Target numbers logged: NO")
          PY

      - name: Run leakage-aware walk-forward and chronological CV
        run: |
          set -o pipefail
          python3 general_walkforward.py --archive super_loto_archive.json --min-train 100 --folds 5 2>&1 | tee walkforward-report.log

      - name: Send evaluation report to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 telegram_report.py \
            --title "Walk-Forward Evaluation" \
            --status "$JOB_STATUS" \
            --run-url "$RUN_URL" \
            --branch "$BRANCH_NAME" \
            --kind "walkforward" \
            --report-log "walkforward-report.log"
