name: GENERAL Fresh-Start Method Registry Tests

on:
  pull_request:
    paths:
      - "general_method_registry.json"
      - "general_method_registry_test.py"
      - "general_core_registry_test.py"
      - "general_core.py"
      - ".github/workflows/method-registry-test.yml"
  push:
    paths:
      - "general_method_registry.json"
      - "general_method_registry_test.py"
      - "general_core_registry_test.py"
      - "general_core.py"
      - ".github/workflows/method-registry-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-start-registry-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile current registry tests
        run: python -m py_compile general_method_registry_test.py general_core_registry_test.py general_core.py
      - name: Test fresh-start registry schema
        run: python -m unittest -v general_method_registry_test
      - name: Test runtime context isolation and regime partition
        run: python -m unittest -v general_core_registry_test
