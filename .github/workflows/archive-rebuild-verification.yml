name: Canonical Archive Rebuild Verification

'on':
  pull_request:
    paths:
      - 'general_archive_fetch.py'
      - 'super_loto_archive.json'
      - 'general_data_guard.py'
      - 'test_general_archive_target_isolation.py'
      - 'historical_archive_source_audit.json'
      - '.github/workflows/archive-rebuild-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-archive-rebuild-verification
  cancel-in-progress: false

jobs:
  verify-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile tools and run synthetic self-tests
        run: |
          python3 -m py_compile general_archive_fetch.py general_data_guard.py test_general_archive_target_isolation.py
          python3 general_archive_fetch.py --self-test

      - name: Preserve proposed archive snapshot before live rebuild
        run: cp super_loto_archive.json committed_super_loto_archive.json

      - name: Rebuild archive using primary and independent sources
        run: |
          if python3 general_archive_fetch.py > archive_rebuild_output.log 2>&1; then
            echo "ARCHIVE REBUILD AND MULTI-YEAR SOURCE RECONCILIATION: PASS"
          else
            echo "ARCHIVE REBUILD FAILED. Source details are suppressed; inspect the tool's controlled error status."
            exit 1
          fi

      - name: Compare committed proposal against independently rebuilt live archive
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load_rows(path):
              try:
                  payload = json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  raise SystemExit("ARCHIVE MATCH CHECK FAILED: a snapshot is unreadable") from None
              if not isinstance(payload, dict) or not isinstance(payload.get("draws"), list):
                  raise SystemExit("ARCHIVE MATCH CHECK FAILED: archive structure is invalid")
              rows = {}
              for row in payload["draws"]:
                  if not isinstance(row, dict):
                      raise SystemExit("ARCHIVE MATCH CHECK FAILED: invalid draw record")
                  day, nums = row.get("date"), row.get("numbers")
                  if not isinstance(day, str) or not isinstance(nums, list):
                      raise SystemExit("ARCHIVE MATCH CHECK FAILED: invalid record fields")
                  if day in rows:
                      raise SystemExit("ARCHIVE MATCH CHECK FAILED: duplicate date")
                  rows[day] = nums
              return rows

          proposed = load_rows("committed_super_loto_archive.json")
          rebuilt = load_rows("super_loto_archive.json")
          proposed_dates, rebuilt_dates = set(proposed), set(rebuilt)
          missing = sorted(rebuilt_dates - proposed_dates)
          extra = sorted(proposed_dates - rebuilt_dates)
          wrong_sets = sorted(
              day for day in proposed_dates & rebuilt_dates
              if proposed[day] != rebuilt[day]
          )
          if missing or extra or wrong_sets:
              print("ARCHIVE MATCH CHECK: FAILED")
              print("Dates missing from committed proposal:", missing[:20])
              print("Unexpected dates in committed proposal:", extra[:20])
              print("Dates with number-set mismatches:", wrong_sets[:20])
              print("Draw-number sets printed: NO")
              raise SystemExit(1)

          print("ARCHIVE MATCH CHECK: PASS")
          print("Committed proposal matches all independently rebuilt live dates and number sets.")
          print("Matched records:", len(proposed))
          print("Draw-number sets printed: NO")
          PY

      - name: Validate rebuilt archive counts and target isolation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import general_data_guard as guard

          path = Path("super_loto_archive.json")
          if not path.is_file():
              raise SystemExit("ARCHIVE CHECK FAILED: rebuilt archive is missing")
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit("ARCHIVE CHECK FAILED: rebuilt archive is unreadable") from None
          if not isinstance(payload, dict) or not isinstance(payload.get("draws"), list):
              raise SystemExit("ARCHIVE CHECK FAILED: archive structure is invalid")

          rows = payload["draws"]
          summary = guard.validate_archive(rows)
          rows_by_date = {row["date"]: row["numbers"] for row in rows}
          expected = {
              "2020": 97,
              "2021": 156,
              "2022": 156,
              "2023": 157,
              "2024": 157,
              "2025": 156,
          }
          counts = {}
          for row in rows:
              year = row["date"][:4]
              counts[year] = counts.get(year, 0) + 1
          for year, count in expected.items():
              if counts.get(year) != count:
                  raise SystemExit(f"ARCHIVE YEAR COUNT FAILED: {year}")
          if counts.get("2026", 0) <= 0:
              raise SystemExit("ARCHIVE YEAR COUNT FAILED: current-year records missing")

          checks = payload.get("cross_source_validation_by_year")
          if not isinstance(checks, list):
              raise SystemExit("SOURCE PROVENANCE FAILED: per-year reconciliation metadata is missing")
          checks_by_year = {str(item.get("year")): item for item in checks if isinstance(item, dict)}
          for year in ("2021", "2022", "2023", "2024", "2025"):
              if checks_by_year.get(year, {}).get("result") != "PASS":
                  raise SystemExit(f"SOURCE RECONCILIATION FAILED: {year}")

          expected_historical_dates = {
              "2021": ("2021-01-31", "2021-11-30"),
              "2022": ("2022-01-02",),
              "2023": (
                  "2023-08-17", "2023-08-20", "2023-10-22", "2023-10-24",
                  "2023-10-26", "2023-10-29", "2023-11-05",
              ),
          }
          audit = payload.get("historical_supplementation_audit")
          if not isinstance(audit, list):
              raise SystemExit("HISTORICAL SOURCE AUDIT FAILED: per-date evidence is missing")
          audit_by_date = {}
          for item in audit:
              if not isinstance(item, dict) or not isinstance(item.get("date"), str):
                  raise SystemExit("HISTORICAL SOURCE AUDIT FAILED: malformed audit row")
              if item["date"] in audit_by_date:
                  raise SystemExit("HISTORICAL SOURCE AUDIT FAILED: duplicate audit date")
              audit_by_date[item["date"]] = item
          expected_flat = {
              draw_date: year
              for year, dates in expected_historical_dates.items()
              for draw_date in dates
          }
          if set(audit_by_date) != set(expected_flat):
              raise SystemExit("HISTORICAL SOURCE AUDIT FAILED: audited date list mismatch")
          for draw_date, year in expected_flat.items():
              item = audit_by_date[draw_date]
              if item.get("year") != int(year) or item.get("result") != "PASS":
                  raise SystemExit(f"HISTORICAL SOURCE AUDIT FAILED: {draw_date}")
              if item.get("evidence") not in (
                  "INDEPENDENT_SOURCE_SUPPLEMENTED_MISSING_PRIMARY_DATE",
                  "SAME_DATE_AND_NUMBERS_IN_BOTH_SOURCES",
              ):
                  raise SystemExit(f"HISTORICAL SOURCE AUDIT FAILED: {draw_date}")
              pages = item.get("independent_source_pages")
              if not isinstance(pages, list) or not pages:
                  raise SystemExit(f"HISTORICAL SOURCE AUDIT FAILED: source URL missing for {draw_date}")
              if not any(f"/{year}" in url for url in pages if isinstance(url, str)):
                  raise SystemExit(f"HISTORICAL SOURCE AUDIT FAILED: wrong source year for {draw_date}")
          print("HISTORICAL SOURCE AUDIT: PASS (10/10 dates reconciled across source archives)")

          # Validate the human-readable source manifest separately from the live fetcher's
          # reconciliation metadata. This checks that the claimed public sources support
          # exactly the dates and number sets currently present in the rebuilt archive.
          manifest_path = Path("historical_archive_source_audit.json")
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              raise SystemExit("SOURCE MANIFEST FAILED: file missing or invalid JSON") from None
          if not isinstance(manifest, dict) or manifest.get("schema_version") != 1:
              raise SystemExit("SOURCE MANIFEST FAILED: invalid schema")
          if manifest.get("official_source_directly_checked") is not False:
              raise SystemExit("SOURCE MANIFEST FAILED: official-source status is misrepresented")
          if manifest.get("official_site_required") is not False:
              raise SystemExit("SOURCE MANIFEST FAILED: unsupported official-source requirement claim")
          manifest_records = manifest.get("records")
          if not isinstance(manifest_records, list):
              raise SystemExit("SOURCE MANIFEST FAILED: records list missing")
          manifest_by_date = {}
          for item in manifest_records:
              if not isinstance(item, dict) or not isinstance(item.get("date"), str):
                  raise SystemExit("SOURCE MANIFEST FAILED: malformed record")
              day = item["date"]
              if day in manifest_by_date:
                  raise SystemExit("SOURCE MANIFEST FAILED: duplicate date")
              nums = item.get("numbers")
              if (
                  not isinstance(nums, list)
                  or len(nums) != 6
                  or len(set(nums)) != 6
                  or any(type(n) is not int or n < 1 or n > 60 for n in nums)
              ):
                  raise SystemExit(f"SOURCE MANIFEST FAILED: invalid six-number set for {day}")
              if rows_by_date.get(day) != nums:
                  raise SystemExit(f"SOURCE MANIFEST FAILED: archive number set mismatch for {day}")
              supporting = [
                  source for source in item.get("confirmation_sources", [])
                  if isinstance(source, dict)
                  and source.get("supports_record") is True
                  and isinstance(source.get("url"), str)
                  and source["url"].startswith("https://")
                  and isinstance(source.get("publisher"), str)
              ]
              if len({source["publisher"] for source in supporting}) < 2:
                  raise SystemExit(f"SOURCE MANIFEST FAILED: fewer than two public supporting publishers for {day}")
              if not isinstance(item.get("status"), str) or not item["status"].startswith("CORROBORATED"):
                  raise SystemExit(f"SOURCE MANIFEST FAILED: missing corroboration status for {day}")
              manifest_by_date[day] = item

          if set(manifest_by_date) != set(expected_flat):
              raise SystemExit("SOURCE MANIFEST FAILED: audited date list mismatch")
          required_discrepancy_dates = {"2021-01-31", "2023-10-29"}
          for day, item in manifest_by_date.items():
              discrepancies = item.get("discrepancy_sources", [])
              if not isinstance(discrepancies, list):
                  raise SystemExit(f"SOURCE MANIFEST FAILED: malformed discrepancy list for {day}")
              if day in required_discrepancy_dates and not discrepancies:
                  raise SystemExit(f"SOURCE MANIFEST FAILED: known source discrepancy omitted for {day}")
              for source in discrepancies:
                  if not isinstance(source, dict) or not isinstance(source.get("url"), str) or not source["url"].startswith("https://"):
                      raise SystemExit(f"SOURCE MANIFEST FAILED: malformed discrepancy source for {day}")

          print("SOURCE MANIFEST: PASS (10 dates match archive; at least two public publishers each; discrepancies retained)")

          target_date = summary["last_date"]
          isolated = guard.isolate_target(rows, target_date)
          if isolated.get("isolation_pass") is not True:
              raise SystemExit("TARGET ISOLATION FAILED")
          if isolated.get("target_present_in_archive") is not True:
              raise SystemExit("TARGET PRESENCE CHECK FAILED")
          if isolated.get("target_numbers_exposed") is not False:
              raise SystemExit("TARGET EXPOSURE CHECK FAILED")
          if target_date in [row["date"] for row in isolated["train"]]:
              raise SystemExit("TARGET LEAKAGE DETECTED")
          if isolated["excluded_dates"] != [target_date]:
              raise SystemExit("TARGET/FUTURE EXCLUSION CHECK FAILED")

          print("DATA GUARD: PASS")
          print("Record count:", summary["record_count"])
          print("First date:", summary["first_date"])
          print("Latest target date:", target_date)
          for year in sorted(counts):
              print(f"Year {year}: {counts[year]} records")
          print("Latest target number set printed: NO")
          print("Target excluded from training: YES")
          print("Independent source reconciliation metadata: PASS")
          PY

      - name: Run archive integrity and target-isolation unit tests
        run: python3 -m unittest -v test_general_archive_target_isolation.py
