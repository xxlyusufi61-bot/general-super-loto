name: GENERAL NVIDIA Manual Unlock

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Only choose yes after manually reviewing the lock reason and account/API status."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  unlock:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create short-lived main writer token for the confirmed manual unlock
        id: main-writer
        uses: ./.github/actions/create-scoped-writer-token
        with:
          client_id: ${{ vars.GENERAL_MAIN_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_MAIN_WRITER_APP_PRIVATE_KEY }}

      - name: Clear lock after explicit confirmation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GENERAL_MAIN_WRITER_TOKEN: ${{ steps.main-writer.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_nvidia_guard.py unlock
