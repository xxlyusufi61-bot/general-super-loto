name: GENERAL NVIDIA API Test

on:
  workflow_dispatch:
    inputs:
      confirm_live_calls:
        description: "Leave NO to block all live NVIDIA API calls. Type the exact phrase only after verifying your provider account is free-only."
        required: true
        type: string
        default: "NO"

permissions:
  contents: write

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  nvidia-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check global NVIDIA safety lock
        if: ${{ inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_nvidia_guard.py check

      - name: Test NVIDIA API connection
        id: nvidia-api-test
        if: ${{ inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request
          import urllib.error

          key = os.environ.get("NVIDIA_API_KEY", "")

          if not key:
              raise SystemExit(
                  "ERROR: NVIDIA_API_KEY secret is missing"
              )

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/models",
              headers={
                  "Authorization": "Bearer " + key,
                  "Accept": "application/json"
              },
              method="GET"
          )

          Path("/tmp/general_nvidia_api_attempted").touch()

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  response_text = response.read().decode("utf-8")

              try:
                  data = json.loads(response_text)
              except json.JSONDecodeError:
                  print("ERROR: API returned invalid JSON.")
                  raise SystemExit(1)

              if not isinstance(data, dict):
                  print("ERROR: API response is not a JSON object.")
                  raise SystemExit(1)

              models = data.get("data")

              if not isinstance(models, list):
                  print("ERROR: API response has no valid model list.")
                  raise SystemExit(1)

              print("NVIDIA API connection successful.")
              print("Authentication: successful")
              print("Available models returned:", len(models))

              for model in models[:10]:
                  if isinstance(model, dict):
                      model_id = model.get("id")
                      if isinstance(model_id, str):
                          print("-", model_id)

              Path("/tmp/general_nvidia_api_succeeded").touch()

              print("NVIDIA API TEST SUCCESS")

          except urllib.error.HTTPError as error:
              print("NVIDIA API HTTP status:", error.code)
              print("Error response body omitted from logs.")
              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("Connection failed:", type(error.reason).__name__)
              raise SystemExit(1)

          except SystemExit:
              raise

          except Exception as error:
              print("Connection test failed:", type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Report no NVIDIA request when confirmation is absent
        if: ${{ inputs.confirm_live_calls != 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' }}
        run: |
          echo "::notice::No live NVIDIA request was authorized or made."
          echo "This workflow requires the exact free-only confirmation phrase for any live request."

      - name: Activate global lock after NVIDIA request failure
        if: ${{ failure() && steps.nvidia-api-test.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f /tmp/general_nvidia_api_attempted ] && [ ! -f /tmp/general_nvidia_api_succeeded ]; then
            python3 general_nvidia_guard.py lock --reason "NVIDIA API model-list request failed or returned an unvalidated response; global pause is required because cause is uncertain."
          else
            echo "No incomplete NVIDIA API request detected; global lock unchanged."
          fi
