name: GENERAL NVIDIA API Test

on:
  workflow_dispatch:
    inputs:
      confirm_live_calls:
        description: "Leave NO to block live NVIDIA API calls. The exact phrase authorizes requests within the shared 1,500-reservation rolling 24-hour budget and category ceilings; there is no per-job request cap. This test makes no more than one request. Normal 30-per-minute and hard 40-per-minute limits remain. Use only after independently verifying free-only/no-billing status."
        required: true
        type: string
        default: "NO"
      confirm_free_usage_verified:
        description: "Set true only after independently verifying this request is free with no billing or automatic paid conversion risk. Otherwise leave false."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  nvidia-test:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check global NVIDIA safety lock
        if: ${{ inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_SHARED_1500_PER_24H_NVIDIA_BUDGET' && inputs.confirm_free_usage_verified == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_nvidia_guard.py check

      - name: Create short-lived NVIDIA budget writer token
        if: ${{ inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_SHARED_1500_PER_24H_NVIDIA_BUDGET' && inputs.confirm_free_usage_verified == true }}
        id: nvidia-budget-writer
        uses: ./.github/actions/create-scoped-writer-token
        with:
          client_id: ${{ vars.GENERAL_NVIDIA_BUDGET_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_NVIDIA_BUDGET_WRITER_APP_PRIVATE_KEY }}

      - name: Test NVIDIA API connection
        id: nvidia-api-test
        if: ${{ inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_SHARED_1500_PER_24H_NVIDIA_BUDGET' && inputs.confirm_free_usage_verified == true }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          GENERAL_NVIDIA_BUDGET_WRITER_TOKEN: ${{ steps.nvidia-budget-writer.outputs.token }}
          GENERAL_NVIDIA_FREE_USAGE_VERIFIED: "true"
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request
          import urllib.error
          from general_nvidia_guard import reserve_nvidia_request

          key = os.environ.get("NVIDIA_API_KEY", "")
          if os.environ.get("GENERAL_NVIDIA_FREE_USAGE_VERIFIED") != "true":
              raise SystemExit("Free-use and no-billing status is not verified; no request sent.")


          if not key:
              raise SystemExit(
                  "ERROR: NVIDIA_API_KEY secret is missing"
              )

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/models",
              headers={
                  "Authorization": "Bearer " + key,
                  "Accept": "application/json"
              },
              method="GET"
          )

          reserve_nvidia_request("nvidia-model-list-test")
          Path("/tmp/general_nvidia_api_attempted").touch()

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  response_text = response.read().decode("utf-8")

              try:
                  data = json.loads(response_text)
              except json.JSONDecodeError:
                  print("ERROR: API returned invalid JSON.")
                  raise SystemExit(1)

              if not isinstance(data, dict):
                  print("ERROR: API response is not a JSON object.")
                  raise SystemExit(1)

              models = data.get("data")

              if not isinstance(models, list):
                  print("ERROR: API response has no valid model list.")
                  raise SystemExit(1)

              print("NVIDIA API connection successful.")
              print("Authentication: successful")
              print("Available models returned:", len(models))

              for model in models[:10]:
                  if isinstance(model, dict):
                      model_id = model.get("id")
                      if isinstance(model_id, str):
                          print("-", model_id)

              Path("/tmp/general_nvidia_api_succeeded").touch()

              print("NVIDIA API TEST SUCCESS")

          except urllib.error.HTTPError as error:
              print("NVIDIA API HTTP status:", error.code)
              print("Error response body omitted from logs.")
              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("Connection failed:", type(error.reason).__name__)
              raise SystemExit(1)

          except SystemExit:
              raise

          except Exception as error:
              print("Connection test failed:", type(error).__name__)
              raise SystemExit(1)
          PY

      - name: Report no NVIDIA request when confirmation is absent
        if: ${{ (inputs.confirm_live_calls != 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_SHARED_1500_PER_24H_NVIDIA_BUDGET' || inputs.confirm_free_usage_verified != true) }}
        run: |
          echo "::notice::No live NVIDIA request was authorized or made."
          echo "This workflow requires the exact free-only confirmation phrase for any live request."

      - name: Create short-lived main writer token for safety-lock persistence
        if: ${{ failure() && steps.nvidia-api-test.outcome == 'failure' }}
        id: main-writer-lock
        uses: ./.github/actions/create-scoped-writer-token
        with:
          client_id: ${{ vars.GENERAL_MAIN_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_MAIN_WRITER_APP_PRIVATE_KEY }}
          allow_prevalidation_safety_lock: 'true'

      - name: Activate global lock after NVIDIA request failure
        if: ${{ failure() && steps.nvidia-api-test.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GENERAL_MAIN_WRITER_TOKEN: ${{ steps.main-writer-lock.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f /tmp/general_nvidia_api_attempted ] && [ ! -f /tmp/general_nvidia_api_succeeded ]; then
            python3 general_nvidia_guard.py lock --reason "NVIDIA API model-list request failed or returned an unvalidated response; global pause is required because cause is uncertain."
          else
            echo "No incomplete NVIDIA API request detected; global lock unchanged."
          fi
