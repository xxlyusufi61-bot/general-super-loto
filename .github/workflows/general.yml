name: GENERAL Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram bot and send status
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import urllib.error

          token = os.environ.get("BOT_TOKEN", "").strip()

          if not token:
              raise SystemExit(
                  "HEARTBEAT FAILED: TELEGRAM_BOT_TOKEN secret is missing."
              )

          base = "https://api.telegram.org/bot" + token

          def request(method, data=None):
              encoded = None

              if data is not None:
                  encoded = urllib.parse.urlencode(data).encode("utf-8")

              req = urllib.request.Request(
                  base + "/" + method,
                  data=encoded,
                  headers={"Accept": "application/json"},
                  method="POST" if encoded is not None else "GET"
              )

              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(
                          response.read().decode("utf-8")
                      )
              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      method + " returned HTTP " + str(error.code)
                  ) from None
              except urllib.error.URLError as error:
                  raise RuntimeError(
                      method + " network error: "
                      + type(error.reason).__name__
                  ) from None
              except json.JSONDecodeError:
                  raise RuntimeError(
                      method + " returned invalid JSON"
                  ) from None

              if not isinstance(payload, dict):
                  raise RuntimeError(
                      method + " returned an invalid response"
                  )

              if payload.get("ok") is not True:
                  raise RuntimeError(
                      method + " was not successful"
                  )

              return payload

          # Verify that the token belongs to a working Telegram bot.
          bot_info = request("getMe")
          bot = bot_info.get("result")

          if not isinstance(bot, dict) or not bot.get("is_bot"):
              raise RuntimeError(
                  "HEARTBEAT FAILED: Bot identity could not be verified."
              )

          # Use an explicit, stable destination. getUpdates is transient and
          # can be empty after another poller consumes the update; it must not
          # be the scheduled heartbeat's only source of the chat identifier.
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not chat_id:
              raise SystemExit(
                  "HEARTBEAT CONFIGURATION REQUIRED: Add a repository Actions "
                  "secret named TELEGRAM_CHAT_ID containing the intended "
                  "Telegram private/group chat ID. Do not use getUpdates as "
                  "persistent storage for the destination."
              )

          if not chat_id.lstrip("-").isdigit():
              raise SystemExit(
                  "HEARTBEAT CONFIGURATION FAILED: TELEGRAM_CHAT_ID must be a "
                  "numeric Telegram chat ID."
              )

          sent = request(
              "sendMessage",
              {
                  "chat_id": chat_id,
                  "text": (
                      "GENERAL Heartbeat: Telegram bağlantısı başarılı. "
                      "Bu test Telegram botunun yanıt verdiğini ve "
                      "mesaj gönderilebildiğini doğruladı. "
                      "GENERAL çekirdeği ve arşiv sağlığı bu testte "
                      "doğrulanmadı."
                  )
              }
          )

          result = sent.get("result")

          if not isinstance(result, dict) or result.get("message_id") is None:
              raise RuntimeError(
                  "HEARTBEAT FAILED: Telegram message was not confirmed."
              )

          print("GENERAL HEARTBEAT: SUCCESS")
          print("Telegram bot authentication: PASS")
          print("Telegram message delivery: PASS")
          print("GENERAL core health: NOT CHECKED")
          print("Archive integrity: NOT CHECKED")
          print("Target isolation: NOT CHECKED")
          PY
