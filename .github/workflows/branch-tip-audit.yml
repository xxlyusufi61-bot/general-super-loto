name: Active Scope Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  active-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject forbidden legacy-pool references in active code and configuration
        run: python tools/branch_tip_audit.py
