name: Active Scope Guard and Legacy Branch Retirement

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  active-scope-guard:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run active scope guard
        run: python tools/branch_tip_audit.py

      - name: Test guarded branch retirement (mock-only; no API mutations)
        run: python -m unittest discover -s tools -p 'test_branch_ref_cleanup.py' -v

  retire-audited-legacy-branch-refs:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.number == 67 && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: general-legacy-branch-retirement
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the merged main tree
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retire only the exact audited branch refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/branch_ref_cleanup.py
