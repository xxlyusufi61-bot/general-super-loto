name: GENERAL Data Guard Test

on:
  workflow_dispatch:
  push:
    paths:
      - "general_data_guard.py"
      - ".github/workflows/general-data-guard-test.yml"

permissions:
  contents: read

jobs:
  data-guard-test:
    name: Test Data Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Data Guard tests
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("general_data_guard.py")
          if not path.is_file():
              raise SystemExit(
                  "FAIL: general_data_guard.py bulunamadi."
              )

          spec = importlib.util.spec_from_file_location(
              "general_data_guard", path
          )
          if spec is None or spec.loader is None:
              raise SystemExit(
                  "FAIL: Data Guard modulu yuklenemedi."
              )

          guard = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(guard)

          def check(condition, message):
              if not condition:
                  raise AssertionError("FAIL: " + message)
              print("PASS:", message)

          archive = [
              {"date": "2026-09-17", "numbers": [1, 8, 15, 22, 39, 51]},
              {"date": "2026-09-20", "numbers": [2, 9, 16, 23, 40, 52]},
              {"date": "2026-09-22", "numbers": [3, 10, 17, 24, 41, 53]},
              {"date": "2026-09-24", "numbers": [4, 11, 18, 25, 42, 54]},
          ]

          summary = guard.validate_archive(archive)
          check(summary["valid"], "Gecerli arsiv kabul edildi")
          check(
              summary["record_count"] == 4,
              "Arsiv kayit sayisi dogru"
          )

          target_date = "2026-09-22"
          result = guard.isolate_target(archive, target_date)

          check(
              result["isolation_pass"] is True,
              "Hedef izolasyonu basarili"
          )
          check(
              result["training_record_count"] == 2,
              "Hedef oncesi iki kayit egitime alindi"
          )
          check(
              result["excluded_record_count"] == 2,
              "Hedef ve sonrasi dislandi"
          )
          check(
              all(
                  row["date"] < target_date
                  for row in result["train"]
              ),
              "Egitim kayitlarinin tamami hedeften once"
          )
          check(
              result["target_present_in_archive"] is True,
              "Hedef tarihi arsivde mevcut"
          )

          expected_excluded_dates = [
              row["date"]
              for row in archive
              if row["date"] >= target_date
          ]

          actual_excluded_dates = result["excluded_dates"]

          check(
              isinstance(actual_excluded_dates, list),
              "Dislanan tarihler liste olarak donuyor"
          )
          check(
              actual_excluded_dates == expected_excluded_dates,
              "Dislanan tarihler hedef ve sonraki tum tarihlerle eslesiyor"
          )
          check(
              len(actual_excluded_dates)
              == result["excluded_record_count"],
              "Dislanan tarih sayisi kayit sayisiyla uyumlu"
          )

          missing_target_date = "2026-09-23"
          missing = guard.isolate_target(
              archive, missing_target_date
          )

          check(
              missing["target_present_in_archive"] is False,
              "Arsivde olmayan hedef dogru belirlendi"
          )
          check(
              missing["isolation_pass"] is True,
              "Eksik hedef durumunda izolasyon sonucu gecerli"
          )
          check(
              all(
                  row["date"] < missing_target_date
                  for row in missing["train"]
              ),
              "Eksik hedefte sonraki kayitlar egitime sizmiyor"
          )

          expected_missing_excluded_dates = [
              row["date"]
              for row in archive
              if row["date"] >= missing_target_date
          ]

          check(
              missing["excluded_dates"]
              == expected_missing_excluded_dates,
              "Eksik hedefte dislanan tarihler dogru"
          )
          check(
              missing["excluded_record_count"]
              == len(expected_missing_excluded_dates),
              "Eksik hedefte dislanan kayit sayisi dogru"
          )

          invalid_cases = [
              (
                  "Tekrarlanan tarih reddediliyor",
                  [
                      {"date": "2026-09-17", "numbers": [1, 8, 15, 22, 39, 51]},
                      {"date": "2026-09-17", "numbers": [2, 9, 16, 23, 40, 52]},
                  ],
              ),
              (
                  "Kronolojik olmayan arsiv reddediliyor",
                  [
                      {"date": "2026-09-20", "numbers": [1, 8, 15, 22, 39, 51]},
                      {"date": "2026-09-17", "numbers": [2, 9, 16, 23, 40, 52]},
                  ],
              ),
              (
                  "Yinelenen sayilar reddediliyor",
                  [
                      {"date": "2026-09-17", "numbers": [1, 1, 15, 22, 39, 51]},
                  ],
              ),
              (
                  "Aralik disindaki sayilar reddediliyor",
                  [
                      {"date": "2026-09-17", "numbers": [1, 8, 15, 22, 39, 61]},
                  ],
              ),
              (
                  "Eksik sayili cekilis reddediliyor",
                  [
                      {"date": "2026-09-17", "numbers": [1, 8, 15, 22, 39]},
                  ],
              ),
              (
                  "Gecersiz tarih reddediliyor",
                  [
                      {"date": "2026-02-30", "numbers": [1, 8, 15, 22, 39, 51]},
                  ],
              ),
          ]

          for label, bad_archive in invalid_cases:
              try:
                  guard.validate_archive(bad_archive)
              except guard.DataGuardError:
                  check(True, label)
              else:
                  check(False, label)

          print("RESULT: ALL DATA GUARD TESTS PASSED")
          PY
