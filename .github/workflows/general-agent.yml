name: GENERAL Agent

'on':
  workflow_dispatch:
    inputs:
      agent:
        description: "Choose an agent"
        required: true
        type: choice
        options:
          - research
          - debug
          - validation
          - crossover
          - archive
      task:
        description: "Task for the selected agent"
        required: true
        type: string
        default: "GENERAL sisteminin mevcut durumunu ve sonraki geliştirme adımlarını değerlendir."

permissions:
  contents: write

concurrency:
  group: general-agent-memory
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get GENERAL source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Initialize memory if missing
        if: ${{ inputs.agent != 'archive' }}
        run: |
          if [ ! -f general_memory.json ]; then
            python3 general_memory.py init
          fi

      - name: Download Super Loto archive
        if: ${{ inputs.agent == 'archive' }}
        run: python3 general_archive_fetch.py

      - name: Validate downloaded archive with Data Guard
        if: ${{ inputs.agent == 'archive' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import general_data_guard as guard

          archive_path = Path("super_loto_archive.json")
          if not archive_path.is_file():
              raise SystemExit("ARCHIVE VALIDATION FAILED: file is missing")

          payload = json.loads(
              archive_path.read_text(encoding="utf-8")
          )

          if not isinstance(payload, dict):
              raise SystemExit(
                  "ARCHIVE VALIDATION FAILED: root must be an object"
              )

          rows = payload.get("draws")
          if not isinstance(rows, list):
              raise SystemExit(
                  "ARCHIVE VALIDATION FAILED: 'draws' must be a list"
              )

          result = guard.validate_archive(rows)
          if not isinstance(result, dict) or result.get("valid") is not True:
              raise SystemExit(
                  "ARCHIVE VALIDATION FAILED: Data Guard rejected the data"
              )

          print("DATA GUARD: PASS")
          print("Records:", result["record_count"])
          print("Unique dates:", result["unique_dates"])
          print("First date:", result["first_date"])
          print("Last date:", result["last_date"])
          PY

      - name: Run selected GENERAL agent
        if: ${{ inputs.agent != 'archive' }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_ID: ${{ inputs.agent }}
          TASK_TEXT: ${{ inputs.task }}
          GENERAL_SAVE_MEMORY: "1"
        run: |
          python3 general_core.py "$AGENT_ID" "$TASK_TEXT"

      - name: Save validated archive or updated memory
        if: ${{ success() }}
        env:
          AGENT_ID: ${{ inputs.agent }}
        run: |
          if [ "$AGENT_ID" = "archive" ]; then
            git add super_loto_archive.json
          elif [ -f general_memory.json ]; then
            git add general_memory.json
          fi

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update validated GENERAL data"
            git push
          else
            echo "No changes to save."
          fi
