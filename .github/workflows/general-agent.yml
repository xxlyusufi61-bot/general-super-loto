name: GENERAL Agent

'on':
  workflow_dispatch:
    inputs:
      agent:
        description: "Choose an agent"
        required: true
        type: choice
        options:
          - research
          - debug
          - validation
          - crossover
          - archive
          - isolation-test
      task:
        description: "Task for the selected agent"
        required: true
        type: string
        default: "GENERAL sisteminin mevcut durumunu ve sonraki geliştirme adımlarını değerlendir."
      confirm_live_calls:
        description: "Leave NO to block live NVIDIA calls. Type the exact phrase only after manually verifying your provider account is free-only."
        required: true
        type: string
        default: "NO"
      publish_memory_pr:
        description: "When YES, publish the new report in a public review-only PR before it can enter shared memory. The report text will be publicly visible. Default NO."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get GENERAL source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check global NVIDIA safety lock
        if: ${{ inputs.agent != 'archive' && inputs.agent != 'isolation-test' && inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 general_nvidia_guard.py check
          echo "GENERAL_NVIDIA_GUARD_PASSED=1" >> "$GITHUB_ENV"

      - name: Initialize memory if missing
        if: ${{ inputs.agent != 'archive' && inputs.agent != 'isolation-test' }}
        run: |
          if [ ! -f general_memory.json ]; then
            python3 general_memory.py init
          fi

      - name: Download Super Loto archive (suppress parser details)
        run: |
          if python3 general_archive_fetch.py > archive_fetch_output.log 2>&1; then
            echo "ARCHIVE FETCH: completed; detailed output suppressed."
          else
            echo "ARCHIVE FETCH FAILED; parser details suppressed to protect draw data."
            exit 1
          fi

      - name: Validate refreshed archive with Data Guard
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import general_data_guard as guard

          archive_path = Path("super_loto_archive.json")
          if not archive_path.is_file():
              raise SystemExit("ARCHIVE VALIDATION FAILED: file is missing")

          payload = json.loads(archive_path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("ARCHIVE VALIDATION FAILED: root must be an object")

          rows = payload.get("draws")
          if not isinstance(rows, list):
              raise SystemExit("ARCHIVE VALIDATION FAILED: 'draws' must be a list")

          result = guard.validate_archive(rows)
          if not isinstance(result, dict) or result.get("valid") is not True:
              raise SystemExit("ARCHIVE VALIDATION FAILED: Data Guard rejected the data")

          print("DATA GUARD: PASS")
          print("Records:", result["record_count"])
          print("Unique dates:", result["unique_dates"])
          print("First date:", result["first_date"])
          print("Last date:", result["last_date"])
          print("Draw numbers exposed in summary: NO")
          PY

      - name: Test latest-draw target isolation with Data Guard
        if: ${{ inputs.agent == 'isolation-test' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import general_data_guard as guard

          archive_path = Path("super_loto_archive.json")

          if not archive_path.is_file():
              raise SystemExit("ISOLATION TEST FAILED: archive file is missing")

          payload = json.loads(archive_path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("ISOLATION TEST FAILED: archive root is not an object")

          rows = payload.get("draws")
          if not isinstance(rows, list):
              raise SystemExit("ISOLATION TEST FAILED: draws list is missing")

          archive_check = guard.validate_archive(rows)
          if not isinstance(archive_check, dict) or archive_check.get("valid") is not True:
              raise SystemExit("ISOLATION TEST FAILED: archive validation failed")

          target_date = archive_check.get("last_date")
          if not isinstance(target_date, str):
              raise SystemExit("ISOLATION TEST FAILED: latest valid target date is missing")

          target_matches = [
              row for row in rows
              if isinstance(row, dict) and row.get("date") == target_date
          ]
          if len(target_matches) != 1:
              raise SystemExit("ISOLATION TEST FAILED: latest target date must appear exactly once")

          result = guard.isolate_target(rows, target_date)

          if not isinstance(result, dict):
              raise SystemExit("ISOLATION TEST FAILED: unexpected Data Guard result")

          if result.get("isolation_pass") is not True:
              raise SystemExit("ISOLATION TEST FAILED: Data Guard did not confirm isolation")

          if result.get("target_present_in_archive") is not True:
              raise SystemExit("ISOLATION TEST FAILED: Data Guard did not confirm target presence")

          train = result.get("train")
          excluded_dates = result.get("excluded_dates")

          if not isinstance(train, list) or not isinstance(excluded_dates, list):
              raise SystemExit("ISOLATION TEST FAILED: unexpected Data Guard result")

          train_dates = [row.get("date") for row in train if isinstance(row, dict)]

          if len(train_dates) != len(train):
              raise SystemExit("ISOLATION TEST FAILED: invalid training record")

          if target_date in train_dates:
              raise SystemExit("ISOLATION TEST FAILED: target date leaked into training")

          if any(not isinstance(day, str) or day >= target_date for day in train_dates):
              raise SystemExit("ISOLATION TEST FAILED: target or future date in training")

          if any(not isinstance(day, str) or day < target_date for day in excluded_dates):
              raise SystemExit("ISOLATION TEST FAILED: a pre-target date was incorrectly excluded")

          expected_excluded_dates = [
              row["date"] for row in rows
              if row["date"] >= target_date
          ]

          if excluded_dates != expected_excluded_dates:
              raise SystemExit("ISOLATION TEST FAILED: excluded dates do not match the archive")

          print("TARGET ISOLATION: PASS")
          print("Dynamic target equals latest valid archive date: YES")
          print("Target date:", target_date)
          print("Training records strictly before target:", len(train))
          print("Target/future dates excluded:", len(excluded_dates))
          print("Target date present exactly once in source archive: YES")
          print("Data Guard isolation flag: PASS")
          print("Data Guard target-presence flag: PASS")
          print("Target numbers displayed: NO")
          PY

      - name: Snapshot shared-memory baseline for optional review PR
        id: memory-baseline
        if: ${{ inputs.agent != 'archive' && inputs.agent != 'isolation-test' && inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' && inputs.publish_memory_pr == 'YES' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/general-agent-memory"
          cp general_memory.json "$RUNNER_TEMP/general-agent-memory/baseline.json"
          sha256sum "$RUNNER_TEMP/general-agent-memory/baseline.json" | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

      - name: Run selected GENERAL agent
        id: run-agent
        if: ${{ inputs.agent != 'archive' && inputs.agent != 'isolation-test' && inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_ID: ${{ inputs.agent }}
          TASK_TEXT: ${{ inputs.task }}
          GENERAL_SAVE_MEMORY: ${{ inputs.publish_memory_pr == 'YES' && '1' || '0' }}
          GENERAL_CONFIRM_LIVE_CALLS: ${{ inputs.confirm_live_calls }}
        run: |
          python3 general_core.py "$AGENT_ID" "$TASK_TEXT"

      - name: Skip live agent call without explicit free-only confirmation
        if: ${{ inputs.agent != 'archive' && inputs.agent != 'isolation-test' && inputs.confirm_live_calls != 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' }}
        run: |
          echo "::notice::Live agent execution was not authorized; no NVIDIA request was made."
          echo "Supply the exact confirmation phrase only after verifying free-only provider settings."

      - name: Activate global lock if an NVIDIA request failed
        if: ${{ failure() && steps.run-agent.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f /tmp/general_nvidia_api_attempted ] && [ ! -f /tmp/general_nvidia_api_succeeded ]; then
            python3 general_nvidia_guard.py lock --reason "GENERAL agent NVIDIA request failed or its response could not be validated; quota, authorization, billing/limit, or service state is uncertain."
          else
            echo "No incomplete NVIDIA API request detected; global lock unchanged."
          fi

      - name: Validate single-agent memory delta
        id: memory-proposal
        if: ${{ success() && steps.run-agent.outcome == 'success' && inputs.publish_memory_pr == 'YES' }}
        env:
          MEMORY_BASELINE: ${{ runner.temp }}/general-agent-memory/baseline.json
          MEMORY_CANDIDATE: general_memory.json
          MEMORY_PROPOSAL: ${{ runner.temp }}/general-agent-memory/memory-delta.json
          AGENT_ID: ${{ inputs.agent }}
        run: |
          set -euo pipefail
          if [ ! -f "$MEMORY_BASELINE" ] || [ ! -f "$MEMORY_CANDIDATE" ]; then
            echo "Memory baseline or candidate is missing; refusing publication."
            exit 1
          fi
          if python3 general_memory_pr_guard.py \
            --baseline "$MEMORY_BASELINE" \
            --candidate "$MEMORY_CANDIDATE" \
            --proposal-output "$MEMORY_PROPOSAL" \
            > "$RUNNER_TEMP/general-agent-memory/summary.json"; then
            :
          else
            cat "$RUNNER_TEMP/general-agent-memory/summary.json"
            echo "Memory guard rejected the candidate; no PR will be created."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"], "general-agent-memory")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          if summary.get("valid") is not True:
              raise SystemExit("Memory guard did not validate the candidate.")
          has_new = summary.get("has_new_entries") is True
          if has_new:
              proposal = json.loads((root / "memory-delta.json").read_text(encoding="utf-8"))
              entries = proposal.get("new_entries")
              if not isinstance(entries, list) or len(entries) != 1:
                  raise SystemExit("Single-agent run must propose exactly one report; refusing publication.")
              if entries[0].get("source") != "GENERAL/" + os.environ["AGENT_ID"]:
                  raise SystemExit("Memory report source does not match the selected agent.")
              if entries[0].get("status") != "unverified":
                  raise SystemExit("New report must remain unverified.")
              if proposal.get("auto_merge") is not False or proposal.get("human_review_required") is not True:
                  raise SystemExit("Memory proposal is not review-only.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_new_entries=" + ("true" if has_new else "false") + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("## Single-agent shared-memory proposal\n\n")
              report.write("- Memory delta guard: PASS\n")
              report.write("- New reports: " + str(summary.get("new_entries_count", 0)) + "\n")
              report.write("- Report status: unverified; human review required\n")
              report.write("- Automatic merge: disabled\n")
              if not has_new:
                  report.write("- No new report was added; no PR will be opened.\n")
          PY

      - name: Publish single-agent memory for human review only
        if: ${{ always() && steps.memory-proposal.outputs.has_new_entries == 'true' && inputs.publish_memory_pr == 'YES' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet
          git show origin/main:general_memory.json > "$RUNNER_TEMP/general-agent-memory/current-main.json"
          if ! cmp -s "$RUNNER_TEMP/general-agent-memory/baseline.json" "$RUNNER_TEMP/general-agent-memory/current-main.json"; then
            echo "::warning::Shared memory changed during the run. No PR was opened; rerun from the current main branch."
            echo "- Memory PR not opened: shared memory changed during the run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="general-agent-memory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git reset --hard origin/main
          git switch -c "$branch" origin/main
          cp "$RUNNER_TEMP/general-agent-memory/candidate.json" general_memory.json
          python3 -m json.tool general_memory.json > /dev/null
          git add -- general_memory.json
          staged_files="$(git diff --cached --name-only)"
          if [ "$staged_files" != "general_memory.json" ]; then
            echo "Unexpected staged files; refusing to publish memory PR."
            exit 1
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Propose validated GENERAL agent report"
          git push origin "$branch"

          body="$(cat <<EOF
          ## Review-only GENERAL agent memory update

          - Only general_memory.json is changed.
          - The report passed general_memory_pr_guard.py against the pre-run baseline.
          - The main-branch memory matched that baseline before the proposal branch was created.
          - The report remains unverified; binding rules and existing entries were not changed.
          - This is a public repository: the new report text is visible in this PR before merge.
          - No automatic merging is enabled; human review and manual merge are required.
          EOF
          )"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --title "GENERAL: Review ${{ inputs.agent }} report (run ${GITHUB_RUN_ID})" --body "$body" --base main --head "$branch")"
          echo "Opened human-review PR: $pr_url"
          echo "- Review PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve safe memory-proposal metadata
        if: ${{ always() }}
        run: |
          mkdir -p general-run-output
          if [ -f "$RUNNER_TEMP/general-agent-memory/summary.json" ]; then
            cp "$RUNNER_TEMP/general-agent-memory/summary.json" general-run-output/memory-proposal-summary.json
          fi

      - name: Preserve archive output only for explicit archive runs
        if: ${{ success() && inputs.agent == 'archive' }}
        run: |
          mkdir -p general-run-output
          if [ -f super_loto_archive.json ]; then
            cp super_loto_archive.json general-run-output/super_loto_archive.json
          else
            echo "ARCHIVE OUTPUT FAILED: validated archive file is missing."
            exit 1
          fi
          # Never publish shared memory, agent reports, or raw fetch logs as artifacts.


      - name: Upload run outputs for review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: general-agent-output
          path: general-run-output/
          if-no-files-found: ignore
          retention-days: 7
