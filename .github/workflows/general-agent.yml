name: GENERAL Agent

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Choose an agent"
        required: true
        type: choice
        options:
          - research
          - debug
          - validation
          - crossover
      task:
        description: "Task for the selected agent"
        required: true
        type: string
        default: "GENERAL sisteminin mevcut durumunu ve sonraki geliştirme adımlarını değerlendir."

permissions:
  contents: write

concurrency:
  group: general-agent-memory
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get GENERAL source code
        uses: actions/checkout@v4

      - name: Set up Python
        run: python3 --version

      - name: Initialize memory if missing
        run: |
          if [ ! -f general_memory.json ]; then
            python3 general_memory.py init
          fi

      - name: Run selected GENERAL agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_ID: ${{ inputs.agent }}
          TASK_TEXT: ${{ inputs.task }}
          GENERAL_SAVE_MEMORY: "1"
        run: |
          python3 general_core.py "$AGENT_ID" "$TASK_TEXT"

      - name: Save updated memory to repository
        run: |
          if ! git diff --quiet -- general_memory.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add general_memory.json
            git commit -m "Update GENERAL project memory"
            git push
          else
            echo "No memory changes to commit."
          fi
