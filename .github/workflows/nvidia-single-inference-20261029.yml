name: NVIDIA Single Inference Diagnostic

on:
  push:
    branches:
      - nvidia-single-inference-20261029-1849

permissions:
  contents: write

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  single-inference-test:
    if: ${{ github.repository == 'xxlyusufi61-bot/general-super-loto' && github.ref == 'refs/heads/nvidia-single-inference-20261029-1849' && github.actor == 'xxlyusufi61-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verify exact one-shot run and active lock snapshot
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
        run: |
          set -eu
          test "$GH_ACTOR" = "xxlyusufi61-bot"
          test "$GH_REPOSITORY" = "xxlyusufi61-bot/general-super-loto"
          test "$GH_REF" = "refs/heads/nvidia-single-inference-20261029-1849"
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path("general_nvidia_lock.json").read_text(encoding="utf-8"))
          if not isinstance(state, dict) or state.get("locked") is not True:
              raise SystemExit("STOP: expected global NVIDIA safety lock is not active in the checked-out snapshot.")
          print("ONE-SHOT CONTEXT: PASS")
          print("Checked-out safety lock: ACTIVE")
          PY

      - name: Temporarily unlock after explicit approval for one request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_nvidia_guard.py unlock

      - name: Verify remote main lock is clear before request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_nvidia_guard.py check

      - name: Send exactly one bounded chat-completion request
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("NVIDIA_API_KEY", "").strip()
          if not token:
              print("NVIDIA INFERENCE TEST: FAIL; NVIDIA_API_KEY secret is missing.")
              raise SystemExit(2)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          payload = {
              "model": "z-ai/glm-5.3-flash",
              "messages": [
                  {
                      "role": "user",
                      "content": "Reply with exactly this text and nothing else: GENERAL_INFERENCE_TEST_OK"
                  }
              ],
              "max_tokens": 64,
              "temperature": 0,
              "reasoning_effort": "low",
              "chat_template_kwargs": {"clear_thinking": True},
              "stream": False
          }
          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "GENERAL-Single-Inference-Diagnostic",
              },
              method="POST",
          )
          opener = urllib.request.build_opener(NoRedirect)

          try:
              with opener.open(request, timeout=30) as response:
                  status = response.getcode()
                  raw = response.read(131073)
          except urllib.error.HTTPError as error:
              print("NVIDIA INFERENCE TEST: FAIL; HTTP status", error.code)
              print("Response body and credentials were not logged; no retry attempted.")
              raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, OSError) as error:
              print("NVIDIA INFERENCE TEST: FAIL; transport error type:", type(error).__name__)
              print("Details suppressed; no retry attempted.")
              raise SystemExit(1)

          if status != 200:
              print("NVIDIA INFERENCE TEST: FAIL; HTTP status", status)
              raise SystemExit(1)
          if len(raw) > 131072:
              print("NVIDIA INFERENCE TEST: FAIL; response exceeded the 128 KiB limit.")
              raise SystemExit(1)

          try:
              result = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError):
              print("NVIDIA INFERENCE TEST: FAIL; response was not valid JSON.")
              raise SystemExit(1)

          choices = result.get("choices") if isinstance(result, dict) else None
          if not isinstance(choices, list) or not choices or not isinstance(choices[0], dict):
              print("NVIDIA INFERENCE TEST: FAIL; choices schema was missing or invalid.")
              raise SystemExit(1)

          message = choices[0].get("message")
          answer = message.get("content") if isinstance(message, dict) else None
          if not isinstance(answer, str) or not answer.strip():
              print("NVIDIA INFERENCE TEST: FAIL; no non-empty final content was returned.")
              print("Reasoning fields were not accepted as final content.")
              raise SystemExit(1)

          expected = "GENERAL_INFERENCE_TEST_OK"
          print("NVIDIA INFERENCE TEST: PASS")
          print("HTTP status: 200")
          print("Model: z-ai/glm-5.3-flash")
          print("Final content received: YES")
          print("Expected marker matched:", "YES" if answer.strip() == expected else "NO")
          print("Output characters:", len(answer.strip()))
          print("Max output tokens requested: 64")
          print("Client timeout: 30 seconds")
          print("Automatic retries: NO")
          print("Response text and credentials were not logged.")
          PY

      - name: Restore global safety lock regardless of test outcome
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 general_nvidia_guard.py lock --reason "Single bounded inference diagnostic ended; no further live requests approved. Restore fail-closed lock."
