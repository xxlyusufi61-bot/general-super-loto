name: GENERAL Missing Target Test

"on":
  workflow_dispatch:
  push:
    paths:
      - "general_core.py"
      - "general_data_guard.py"
      - "general_core_missing_target_test.py"
      - ".github/workflows/general-missing-target-test.yml"

permissions:
  contents: read

jobs:
  missing-target-test:
    name: Verify missing target is rejected
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python3 -m py_compile general_core.py general_data_guard.py general_core_missing_target_test.py

      - name: Run missing-target test
        run: python3 general_core_missing_target_test.py
