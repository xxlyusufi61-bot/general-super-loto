name: GENERAL Autonomous Research Cycle

'on':
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Read status, activate, pause, or accept an internal bot-only continuation."
        required: true
        type: choice
        options:
          - status
          - activate
          - pause
          - continue
        default: status
      authorization_phrase:
        description: "For activation only, enter the exact autonomous free-only authorization phrase."
        required: false
        type: string
        default: "NO"
      confirm_free_usage_verified:
        description: "Only true after independently verifying free-only/no-billing status."
        required: true
        type: boolean
        default: false
      authorization_days:
        description: "Automatic-use authorization expiry."
        required: true
        type: choice
        options:
          - "1"
          - "7"
          - "30"
        default: "7"
      continuous_session_id:
        description: "Internal bot-only session identifier. Do not set manually."
        required: false
        type: string
        default: ""
      continuous_started_at_utc:
        description: "Internal bot-only fixed session start. Do not set manually."
        required: false
        type: string
        default: ""
      continuous_deadline_at_utc:
        description: "Internal bot-only fixed session deadline. Do not set manually."
        required: false
        type: string
        default: ""
      continuous_iteration:
        description: "Internal bot-only research iteration number. Do not set manually."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  control:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action != 'continue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hydrate verified GENERAL state-store data
        id: state_bootstrap
        uses: ./.github/actions/hydrate-automation-state
        with:
          token: ${{ github.token }}
      - name: Read automation status
        if: ${{ inputs.action == 'status' }}
        run: python3 general_autonomous_research.py status
      - name: Activate bounded autonomous authorization
        if: ${{ inputs.action == 'activate' }}
        env:
          AUTO_CONFIRMATION: ${{ inputs.authorization_phrase }}
          FREE_USAGE_VERIFIED: ${{ inputs.confirm_free_usage_verified && 'true' || 'false' }}
          AUTHORIZATION_DAYS: ${{ inputs.authorization_days }}
        run: |
          python3 general_autonomous_research.py activate \
            --confirmation "$AUTO_CONFIRMATION" \
            --free-usage-verified "$FREE_USAGE_VERIFIED" \
            --days "$AUTHORIZATION_DAYS"
      - name: Pause autonomous research
        if: ${{ inputs.action == 'pause' }}
        run: python3 general_autonomous_research.py pause
      - name: Persist authorization or pause state
        if: ${{ inputs.action == 'activate' || inputs.action == 'pause' }}
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.state_bootstrap.outputs.generation }}
          objects: autonomous_research_state
          message: "Update autonomous research authorization"
      - name: Summarize control action
        if: always()
        run: |
          echo "Action: ${{ inputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No NVIDIA request is made by activation, pause, or status actions." >> "$GITHUB_STEP_SUMMARY"

  archive-refresh:
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'continue' && github.actor == 'github-actions[bot]' && github.ref == 'refs/heads/main')) && vars.GENERAL_SCOPED_WRITERS_VALIDATED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Hydrate verified GENERAL state-store data
        id: state_bootstrap
        uses: ./.github/actions/hydrate-automation-state
        with:
          token: ${{ github.token }}
      - name: Refresh and validate the 6-of-60 canonical archive
        run: |
          if python3 general_archive_fetch.py > /tmp/general-archive-fetch.log 2>&1; then
            echo "Archive refresh completed and validated."
          else
            echo "Archive refresh failed; no research cycle will start."
            exit 1
          fi
      - name: Persist the refreshed canonical archive in the state store
        id: persist_archive
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.state_bootstrap.outputs.generation }}
          objects: archive
          message: "Refresh validated Super Loto archive"

  scheduled-cycle:
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'continue' && github.actor == 'github-actions[bot]' && github.ref == 'refs/heads/main')) && vars.GENERAL_SCOPED_WRITERS_VALIDATED == 'true' && needs.archive-refresh.result == 'success' }}
    needs: archive-refresh
    outputs:
      continue_enabled: ${{ steps.continuation_plan.outputs.continue_enabled }}
      stop_reason: ${{ steps.continuation_plan.outputs.stop_reason }}
      session_id: ${{ steps.continuation_plan.outputs.session_id }}
      started_at_utc: ${{ steps.continuation_plan.outputs.started_at_utc }}
      deadline_at_utc: ${{ steps.continuation_plan.outputs.deadline_at_utc }}
      next_iteration: ${{ steps.continuation_plan.outputs.next_iteration }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned NVIDIA OpenAI SDK
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Hydrate verified GENERAL state-store data
        id: state_bootstrap
        uses: ./.github/actions/hydrate-automation-state
        with:
          token: ${{ github.token }}
      - name: Validate continuous research session envelope
        id: continuous_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          SESSION_ID: ${{ inputs.continuous_session_id }}
          STARTED_AT_UTC: ${{ inputs.continuous_started_at_utc }}
          DEADLINE_AT_UTC: ${{ inputs.continuous_deadline_at_utc }}
          ITERATION: ${{ inputs.continuous_iteration }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 general_continuous_research.py session-context \
              --event schedule \
              --actor "$ACTOR" \
              --ref "$REF" \
              --run-id "$RUN_ID" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 general_continuous_research.py session-context \
              --event "$EVENT_NAME" \
              --action "$ACTION" \
              --actor "$ACTOR" \
              --ref "$REF" \
              --run-id "$RUN_ID" \
              --session-id "$SESSION_ID" \
              --started-at-utc "$STARTED_AT_UTC" \
              --deadline-at-utc "$DEADLINE_AT_UTC" \
              --iteration "$ITERATION" \
              --github-output "$GITHUB_OUTPUT"
          fi
      - name: Verify active state-store authority and global safety lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 general_automation_state_integrity_audit.py
      - name: Observe the latest canonical archive and preserve one active target
        id: queue_capture
        run: |
          python3 general_autonomous_research.py queue-capture \
            --archive super_loto_archive.json \
            --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Persist the active snapshot and latest archive cursor without changing protected objects
        id: persist_queue
        if: ${{ steps.queue_capture.outputs.changed == 'true' }}
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.state_bootstrap.outputs.generation }}
          objects: autonomous_research_state
          message: "Persist active-target snapshot and latest archive cursor"

      - name: Materialize the pinned active-target snapshot for offline mathematical research
        id: offline_materialize
        if: ${{ steps.queue_capture.outputs.has_pending == 'true' }}
        run: |
          python3 general_autonomous_research.py queue-materialize \
            --output super_loto_archive.json
      - name: Detect pending sealed claim before offline discovery
        id: pending_claim_check
        if: ${{ steps.queue_capture.outputs.has_pending == 'true' }}
        run: |
          python3 general_sealed_evaluation.py pending-claim --archive super_loto_archive.json --ledger general_evaluation_ledger.json --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Run bounded offline hypothesis discovery and evaluation
        id: offline_discovery
        if: ${{ steps.queue_capture.outputs.has_pending == 'true' && steps.pending_claim_check.outcome == 'success' && steps.pending_claim_check.outputs.pending_claim != 'true' }}
        continue-on-error: true
        run: |
          python3 general_offline_hypothesis_discovery.py run \
            --archive super_loto_archive.json \
            --sealed-ledger general_evaluation_ledger.json \
            --memory general_research_memory.json \
            --report general_offline_research_report.json \
            --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Persist offline GENERAL learning through the existing state store
        id: persist_offline_memory
        if: ${{ steps.offline_discovery.outcome == 'success' && steps.offline_discovery.outputs.offline_status == 'COMPLETED_EXPLORATORY_ONLY' && steps.offline_discovery.outputs.offline_memory_entries_added == '1' }}
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.persist_queue.outputs.generation || steps.state_bootstrap.outputs.generation }}
          objects: research_memory
          message: "Append validated offline GENERAL learning to research_memory state object"
      - name: Send offline hypothesis and evaluation summary to Telegram
        if: ${{ steps.persist_offline_memory.outcome == 'success' && steps.persist_offline_memory.outputs.generation != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 telegram_report.py \
            --title "GENERAL çevrimdışı matematiksel keşif" \
            --status success \
            --branch general-automation-state \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --kind offline \
            --report-log general_offline_research_report.json \
            --non-blocking-delivery
      - name: Upload offline research report
        if: ${{ always() && steps.offline_discovery.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: general-offline-research-${{ github.run_id }}
          path: |
            general_offline_research_report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Check explicit authorization and local global-lock state
        id: status
        run: |
          python3 general_autonomous_research.py status --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Report scheduled cycle skipped by global NVIDIA lock
        id: skipped_global_lock
        if: ${{ steps.queue_capture.outputs.has_pending == 'true' && steps.status.outcome == 'success' && steps.status.outputs.lock_clear == 'false' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          {
            echo "## SKIPPED_GLOBAL_LOCK"
            echo ""
            echo "NVIDIA-backed research was skipped because the global NVIDIA safety lock is active."
            echo "No NVIDIA API request was made by this cycle."
          } >> "$GITHUB_STEP_SUMMARY"
          python3 telegram_report.py \
            --title "SKIPPED_GLOBAL_LOCK: NVIDIA araştırması global güvenlik kilidi nedeniyle atlandı" \
            --status skipped \
            --branch main \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --kind status
      - name: Verify remote global NVIDIA safety lock
        if: ${{ steps.status.outputs.authorized == 'true' && steps.status.outputs.lock_clear == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 general_nvidia_guard.py check
          echo "GENERAL_NVIDIA_GUARD_PASSED=1" >> "$GITHUB_ENV"
      - name: Materialize only the pinned active-target snapshot
        if: ${{ steps.status.outputs.authorized == 'true' && steps.status.outputs.lock_clear == 'true' && steps.queue_capture.outputs.has_pending == 'true' }}
        run: |
          python3 general_autonomous_research.py queue-materialize \
            --output super_loto_archive.json

      - name: Prepare one research pass for the active target and fresh sealed windows
        id: prepare
        if: ${{ steps.status.outputs.authorized == 'true' && steps.status.outputs.lock_clear == 'true' && steps.queue_capture.outputs.has_pending == 'true' }}
        run: |
          python3 general_autonomous_research.py prepare \
            --archive super_loto_archive.json \
            --ledger general_evaluation_ledger.json \
            --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Claim this target before any provider request
        id: attempt_reservation
        if: ${{ steps.prepare.outputs.eligible == 'true' }}
        run: |
          python3 general_autonomous_research.py claim \
            --archive super_loto_archive.json \
            --ledger general_evaluation_ledger.json \
            --run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Persist the target-attempt reservation in the state store
        id: persist_attempt
        if: ${{ steps.attempt_reservation.outputs.attempt_id != '' }}
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.persist_offline_memory.outputs.generation || steps.persist_queue.outputs.generation || steps.state_bootstrap.outputs.generation }}
          objects: autonomous_research_state
          message: "Reserve autonomous research target"
      - name: Recover exact evaluated candidate pair for an interrupted local score without NVIDIA
        id: frozen_recovery
        if: ${{ steps.attempt_reservation.outputs.attempt_id != '' }}
        env:
          ATTEMPT_ID: ${{ steps.attempt_reservation.outputs.attempt_id }}
        run: |
          python3 general_target_evaluator.py --recover-candidates \
            --attempt-id "$ATTEMPT_ID" \
            --ledger general_evaluation_ledger.json \
            --memory general_research_memory.json \
            --state general_autonomous_research_state.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --claim-output open_research_evaluation_claim.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Create short-lived NVIDIA budget writer token
        if: ${{ steps.attempt_reservation.outputs.attempt_id != '' && steps.frozen_recovery.outcome == 'success' && steps.frozen_recovery.outputs.recovery_required != 'true' }}
        id: nvidia-budget-writer
        uses: ./.github/actions/create-scoped-writer-token
        with:
          client_id: ${{ vars.GENERAL_NVIDIA_BUDGET_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_NVIDIA_BUDGET_WRITER_APP_PRIVATE_KEY }}

      - name: Run independent forward and reverse NVIDIA discovery
        id: research
        if: ${{ steps.attempt_reservation.outputs.attempt_id != '' && steps.frozen_recovery.outcome == 'success' && steps.frozen_recovery.outputs.recovery_required != 'true' }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TASK_TEXT: "Explore the validated pre-target 6-of-60 archive from scratch. Propose independently testable hypotheses for the forward and reverse directions. Do not request, infer, or report winning-number predictions."
          GENERAL_CONFIRM_LIVE_CALLS: "I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_SHARED_1500_PER_24H_NVIDIA_BUDGET"
          GENERAL_ALLOW_NVIDIA_CALL: "true"
          GENERAL_NVIDIA_FREE_USAGE_VERIFIED: "true"
          GENERAL_NVIDIA_GUARD_PASSED: "1"
          GENERAL_NVIDIA_BUDGET_WRITER_TOKEN: ${{ steps.nvidia-budget-writer.outputs.token }}
          GENERAL_NVIDIA_RESEARCH_RETRY_MODE: ${{ steps.prepare.outputs.retryable == 'true' && 'true' || 'false' }}
        run: python3 general_open_research.py
      - name: Create short-lived main writer token for safety-lock persistence
        if: ${{ failure() && steps.research.outcome == 'failure' }}
        id: main-writer-lock
        uses: ./.github/actions/create-scoped-writer-token
        with:
          client_id: ${{ vars.GENERAL_MAIN_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_MAIN_WRITER_APP_PRIVATE_KEY }}
          allow_prevalidation_safety_lock: 'true'

      - name: Activate global lock after an incomplete provider request
        if: ${{ failure() && steps.research.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GENERAL_MAIN_WRITER_TOKEN: ${{ steps.main-writer-lock.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uncertain_request=false
          for request_label in forward reverse forward_critique between_draws unlabelled; do
            if [ -f "/tmp/general_nvidia_api_attempted_${request_label}" ] && [ ! -f "/tmp/general_nvidia_api_succeeded_${request_label}" ] && [ ! -f "/tmp/general_nvidia_api_known_http_5xx_${request_label}" ]; then
              uncertain_request=true
            fi
          done
          if [ "$uncertain_request" = "true" ]; then
            python3 general_nvidia_guard.py lock --reason "Autonomous NVIDIA request delivery or response validation is uncertain; global safety pause is required. No automatic retry is allowed."
          else
            echo "Only completed, explicit HTTP rejection, or known HTTP 5xx outcomes were observed; global lock unchanged."
          fi
      - name: Create the frozen sealed evaluation claim
        id: sealed_claim
        if: ${{ success() && steps.research.outcome == 'success' }}
        run: |
          python3 general_sealed_evaluation.py claim \
            --archive super_loto_archive.json \
            --ledger general_evaluation_ledger.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --output open_research_evaluation_claim.json \
            --sealed-plan open_research_sealed_plan.json \
            --github-output "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Create short-lived main writer token for sealed snapshot persistence
        if: ${{ steps.sealed_claim.outputs.claim_created == 'true' }}
        id: main-writer-snapshot
        uses: ./.github/actions/create-scoped-writer-token
        with:
          client_id: ${{ vars.GENERAL_MAIN_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_MAIN_WRITER_APP_PRIVATE_KEY }}

      - name: Persist immutable sealed archive snapshot on main
        id: persist_claim_snapshot
        if: ${{ steps.sealed_claim.outputs.claim_created == 'true' }}
        env:
          GENERAL_MAIN_WRITER_TOKEN: ${{ steps.main-writer-snapshot.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general_evaluation_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Store immutable autonomous evaluation snapshot"
            python3 general_writer_auth.py git-push --role main --remote origin --ref HEAD:main
          fi
      - name: Persist sealed claim in the state store
        id: persist_claim
        if: ${{ steps.sealed_claim.outputs.claim_created == 'true' }}
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.persist_attempt.outputs.generation }}
          objects: evaluation_ledger
          message: "Reserve autonomous sealed evaluation holdouts"
      - name: Evaluate the frozen candidates chronologically
        id: evaluation
        if: ${{ steps.sealed_claim.outputs.claim_created == 'true' }}
        env:
          SEALED_CLAIM_ID: ${{ steps.frozen_recovery.outputs.claim_id || steps.sealed_claim.outputs.claim_id }}
        run: |
          python3 general_sealed_evaluation.py evaluate \
            --claim-id "$SEALED_CLAIM_ID" \
            --ledger general_evaluation_ledger.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --output open_research_evaluation_report.json
      - name: Persist evaluation completion in the state store
        id: persist_eval
        if: ${{ steps.evaluation.outcome == 'success' }}
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.persist_claim.outputs.generation }}
          objects: evaluation_ledger
          message: "Record autonomous sealed evaluation completion"
      - name: Evaluate the hidden current target locally
        id: target_evaluation
        if: ${{ steps.frozen_recovery.outputs.recovery_available == 'true' || (steps.evaluation.outcome == 'success' && steps.persist_eval.outcome == 'success') || steps.sealed_claim.outputs.claim_reused == 'true' }}
        env:
          SEALED_CLAIM_ID: ${{ steps.frozen_recovery.outputs.claim_id || steps.sealed_claim.outputs.claim_id }}
          ATTEMPT_ID: ${{ steps.attempt_reservation.outputs.attempt_id }}
        run: |
          python3 general_target_evaluator.py \
            --claim-id "$SEALED_CLAIM_ID" \
            --attempt-id "$ATTEMPT_ID" \
            --ledger general_evaluation_ledger.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --state general_autonomous_research_state.json \
            --snapshot-directory general_evaluation_snapshots \
            --output open_research_target_evaluation_report.json
      - name: Append sanitized GENERAL research memory
        id: research_memory
        if: ${{ always() && steps.attempt_reservation.outputs.attempt_id != '' }}
        env:
          CLAIM_OUTCOME: ${{ steps.sealed_claim.outcome }}
          CLAIM_PERSIST_OUTCOME: ${{ steps.persist_claim.outcome }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          TARGET_EVALUATION_OUTCOME: ${{ steps.target_evaluation.outcome }}
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
        run: |
          failure_stage=""
          if [ "$RESEARCH_OUTCOME" = "failure" ]; then
            echo "The research runner records the failed direction and stage."
          elif [ "$CLAIM_OUTCOME" = "failure" ]; then
            failure_stage="sealed_claim"
          elif [ "$CLAIM_PERSIST_OUTCOME" = "failure" ]; then
            failure_stage="sealed_claim_persistence"
          elif [ "$EVALUATION_OUTCOME" = "failure" ]; then
            failure_stage="sealed_evaluation"
          elif [ "$TARGET_EVALUATION_OUTCOME" = "failure" ]; then
            failure_stage="local_target_evaluation"
          fi
          if python3 general_research_memory.py record-cycle \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --failure-stage "$failure_stage" \
            --error-type "WorkflowStepFailure"; then
            :
          else
            echo "GENERAL research-memory append failed; the existing ledger and target isolation were not modified."
            exit 1
          fi
          echo "Research memory is staged for the dedicated state-store commit."

      - name: Record successful evaluation outcome
        id: finish_evaluation
        if: ${{ always() && steps.attempt_reservation.outputs.attempt_id != '' && (steps.frozen_recovery.outputs.recovery_available == 'true' || (steps.sealed_claim.outputs.claim_created == 'true' && steps.evaluation.outcome == 'success' && steps.persist_eval.outcome == 'success') || steps.sealed_claim.outputs.claim_reused == 'true') && steps.target_evaluation.outcome == 'success' && steps.research_memory.outcome == 'success' }}
        env:
          ATTEMPT_ID: ${{ steps.attempt_reservation.outputs.attempt_id }}
        run: |
          python3 general_autonomous_research.py finish \
            --attempt-id "$ATTEMPT_ID" \
            --outcome SUCCEEDED \
            --reason-code EVALUATION_COMPLETED \
            --ledger general_evaluation_ledger.json
      - name: Record no-candidate outcome without scoring the archive
        id: finish_no_candidate
        if: ${{ always() && steps.attempt_reservation.outputs.attempt_id != '' && steps.frozen_recovery.outputs.recovery_required != 'true' && steps.research.outcome == 'success' && steps.sealed_claim.outcome == 'success' && steps.sealed_claim.outputs.claim_created != 'true' && steps.sealed_claim.outputs.claim_reused != 'true' && steps.research_memory.outcome == 'success' }}
        env:
          ATTEMPT_ID: ${{ steps.attempt_reservation.outputs.attempt_id }}
        run: |
          python3 general_autonomous_research.py finish \
            --attempt-id "$ATTEMPT_ID" \
            --outcome NO_ELIGIBLE_CANDIDATE \
            --reason-code NO_FROZEN_DIRECTIONAL_CANDIDATE
      - name: Record failed claimed cycle
        id: finish_failed
        if: ${{ always() && steps.attempt_reservation.outputs.attempt_id != '' && (steps.persist_attempt.outcome == 'failure' || steps.persist_claim_snapshot.outcome == 'failure' || steps.frozen_recovery.outcome == 'failure' || (steps.frozen_recovery.outputs.recovery_required == 'true' && steps.frozen_recovery.outputs.recovery_available != 'true') || steps.research.outcome == 'failure' || steps.sealed_claim.outcome == 'failure' || steps.persist_claim.outcome == 'failure' || steps.evaluation.outcome == 'failure' || steps.persist_eval.outcome == 'failure' || steps.target_evaluation.outcome == 'failure' || steps.research_memory.outcome == 'failure' || steps.finish_evaluation.outcome == 'failure' || steps.finish_no_candidate.outcome == 'failure') }}
        env:
          ATTEMPT_ID: ${{ steps.attempt_reservation.outputs.attempt_id }}
          CLAIM_CREATED: ${{ steps.sealed_claim.outputs.claim_created }}
          CLAIM_REUSED: ${{ steps.sealed_claim.outputs.claim_reused }}
          CLAIM_PERSIST_OUTCOME: ${{ steps.persist_claim.outcome }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          TARGET_EVALUATION_OUTCOME: ${{ steps.target_evaluation.outcome }}
          FROZEN_RECOVERY_OUTCOME: ${{ steps.frozen_recovery.outcome }}
          FROZEN_RECOVERY_REQUIRED: ${{ steps.frozen_recovery.outputs.recovery_required }}
          FROZEN_RECOVERY_AVAILABLE: ${{ steps.frozen_recovery.outputs.recovery_available }}
          FINISH_EVALUATION_OUTCOME: ${{ steps.finish_evaluation.outcome }}
          FINISH_NO_CANDIDATE_OUTCOME: ${{ steps.finish_no_candidate.outcome }}
          RESEARCH_MEMORY_OUTCOME: ${{ steps.research_memory.outcome }}
        run: |
          incomplete_request=false
          any_request=false
          http_rejection_no_retry=false
          known_http_5xx=false
          for request_label in forward reverse forward_critique between_draws unlabelled; do
            if [ -f "/tmp/general_nvidia_api_attempted_${request_label}" ]; then
              any_request=true
              if [ ! -f "/tmp/general_nvidia_api_succeeded_${request_label}" ]; then
                if [ -f "/tmp/general_nvidia_api_no_retry_${request_label}" ]; then
                  http_rejection_no_retry=true
                elif [ -f "/tmp/general_nvidia_api_known_http_5xx_${request_label}" ]; then
                  known_http_5xx=true
                else
                  incomplete_request=true
                fi
              fi
            fi
          done
          if [ "$TARGET_EVALUATION_OUTCOME" = "failure" ] || { [ "$FROZEN_RECOVERY_REQUIRED" = "true" ] && [ "$FROZEN_RECOVERY_AVAILABLE" != "true" ]; }; then
            reason_code="SEALED_EVALUATION_INCOMPLETE"
          elif [ "$FROZEN_RECOVERY_OUTCOME" = "failure" ]; then
            reason_code="WORKFLOW_FAILED"
          elif [ "$FINISH_EVALUATION_OUTCOME" = "failure" ] || [ "$FINISH_NO_CANDIDATE_OUTCOME" = "failure" ]; then
            reason_code="WORKFLOW_FAILED"
          elif [ "$CLAIM_CREATED" = "true" ] && [ "$CLAIM_PERSIST_OUTCOME" = "success" ] && [ "$EVALUATION_OUTCOME" = "failure" ] && [ "$RESEARCH_MEMORY_OUTCOME" = "success" ]; then
            # The append-only entry is still CLAIMED, not EVALUATED. Route through
            # WORKFLOW_FAILED so the existing manual-unlock gate applies; the next
            # run can reuse the exact candidates from GENERAL memory and resume the
            # pending claim. SEALED_EVALUATION_INCOMPLETE is reserved for a failure
            # after the sealed claim reached EVALUATED and local scoring was pending.
            reason_code="WORKFLOW_FAILED"
          elif [ -f "/tmp/general_directional_candidates_incomplete" ]; then
            reason_code="DIRECTIONAL_CANDIDATE_SET_INCOMPLETE"
          elif [ "$http_rejection_no_retry" = "true" ]; then
            reason_code="PROVIDER_HTTP_REJECTION_NO_RETRY"
          elif [ "$incomplete_request" = "true" ]; then
            reason_code="PROVIDER_DELIVERY_UNCERTAIN"
          elif [ "$known_http_5xx" = "true" ]; then
            reason_code="PROVIDER_HTTP_5XX_RETRYABLE"
          elif [ "$any_request" = "true" ]; then
            reason_code="WORKFLOW_FAILED"
          else
            reason_code="NO_PROVIDER_REQUEST_SENT"
          fi
          python3 general_autonomous_research.py finish \
            --attempt-id "$ATTEMPT_ID" \
            --outcome FAILED \
            --reason-code "$reason_code"
      - name: Persist final scheduler state and sanitized research memory
        id: persist_final_state
        if: ${{ always() && steps.attempt_reservation.outputs.attempt_id != '' }}
        uses: ./.github/actions/publish-automation-state
        with:
          app_client_id: ${{ vars.GENERAL_AUTOMATION_STATE_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_AUTOMATION_STATE_WRITER_APP_PRIVATE_KEY }}
          expected_generation: ${{ steps.persist_eval.outputs.generation || steps.persist_claim.outputs.generation || steps.persist_attempt.outputs.generation || steps.state_bootstrap.outputs.generation }}
          objects: autonomous_research_state research_memory
          message: "Persist autonomous cycle outcome and sanitized research memory"

      - name: Send separate forward and reverse Telegram reports
        id: telegram_success
        if: ${{ steps.evaluation.outcome == 'success' && steps.target_evaluation.outcome == 'success' && steps.persist_final_state.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 telegram_report.py \
            --title "Otonom araştırma turu" \
            --status success \
            --branch general-automation-state \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --kind research \
            --report-log open_research_evaluation_report.json
      - name: Notify Telegram when no directional DSL candidate was eligible
        id: telegram_no_candidate
        if: ${{ steps.attempt_reservation.outputs.attempt_id != '' && steps.research.outcome == 'success' && steps.sealed_claim.outcome == 'success' && steps.sealed_claim.outputs.claim_created != 'true' && steps.sealed_claim.outputs.claim_reused != 'true' && steps.persist_final_state.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 telegram_report.py \
            --title "Otonom araştırma: yürütülebilir aday bulunamadı" \
            --status success \
            --branch general-automation-state \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Notify Telegram after a failed claimed cycle
        id: telegram_failure
        if: ${{ always() && steps.attempt_reservation.outputs.attempt_id != '' && (steps.persist_attempt.outcome == 'failure' || steps.persist_claim_snapshot.outcome == 'failure' || steps.frozen_recovery.outcome == 'failure' || (steps.frozen_recovery.outputs.recovery_required == 'true' && steps.frozen_recovery.outputs.recovery_available != 'true') || steps.research.outcome == 'failure' || steps.sealed_claim.outcome == 'failure' || steps.persist_claim.outcome == 'failure' || steps.evaluation.outcome == 'failure' || steps.persist_eval.outcome == 'failure' || steps.target_evaluation.outcome == 'failure' || steps.research_memory.outcome == 'failure' || steps.finish_evaluation.outcome == 'failure' || steps.finish_no_candidate.outcome == 'failure' || steps.finish_failed.outcome == 'failure' || steps.persist_final_state.outcome == 'failure') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 telegram_report.py \
            --title "Otonom araştırma döngüsü" \
            --status failure \
            --branch general-automation-state \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload number-safe autonomous cycle artifacts
        if: ${{ always() && steps.attempt_reservation.outputs.attempt_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: general-autonomous-cycle-${{ github.run_id }}
          path: |
            open_research_report.md
            open_research_forward_report.md
            open_research_reverse_report.md
            open_research_proposals.json
            open_research_execution_specs.json
            open_research_usage.json
            open_research_usage_forward.json
            open_research_usage_reverse.json
            open_research_sealed_plan.json
            open_research_evaluation_claim.json
            open_research_evaluation_report.json
            open_research_run_status.json
            open_research_retry_audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Decide whether another research turn is safe
        id: continuation_plan
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          SESSION_ID: ${{ steps.continuous_context.outputs.session_id }}
          STARTED_AT_UTC: ${{ steps.continuous_context.outputs.started_at_utc }}
          DEADLINE_AT_UTC: ${{ steps.continuous_context.outputs.deadline_at_utc }}
          ITERATION: ${{ steps.continuous_context.outputs.iteration }}
          SUCCESS_REPORT_OUTCOME: ${{ steps.telegram_success.outcome }}
          NO_CANDIDATE_REPORT_OUTCOME: ${{ steps.telegram_no_candidate.outcome }}
          FAILURE_REPORT_OUTCOME: ${{ steps.telegram_failure.outcome }}
        run: |
          set -euo pipefail
          report_delivered=false
          if [ "$SUCCESS_REPORT_OUTCOME" = "success" ] \
            || [ "$NO_CANDIDATE_REPORT_OUTCOME" = "success" ] \
            || [ "$FAILURE_REPORT_OUTCOME" = "success" ]; then
            report_delivered=true
          fi
          python3 general_continuous_research.py plan-next \
            --event "$EVENT_NAME" \
            --action "$ACTION" \
            --actor "$ACTOR" \
            --ref "$REF" \
            --run-id "$RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --session-id "$SESSION_ID" \
            --started-at-utc "$STARTED_AT_UTC" \
            --deadline-at-utc "$DEADLINE_AT_UTC" \
            --iteration "$ITERATION" \
            --report-delivered "$report_delivered" \
            --github-output "$GITHUB_OUTPUT"
      - name: Report why the continuous research session stopped
        if: ${{ always() && steps.continuation_plan.outcome == 'success' && steps.continuation_plan.outputs.continue_enabled != 'true' && steps.continuation_plan.outputs.stop_reason != '' && steps.continuation_plan.outputs.stop_reason != 'NO_EXECUTABLE_HYPOTHESIS' && steps.continuation_plan.outputs.stop_reason != 'TELEGRAM_REPORT_NOT_CONFIRMED' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOP_REASON: ${{ steps.continuation_plan.outputs.stop_reason }}
        run: |
          python3 telegram_report.py \
            --title "GENERAL sürekli araştırma oturumu durdu: $STOP_REASON" \
            --status skipped \
            --branch general-automation-state \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --kind status

  continue-research:
    needs: scheduled-cycle
    if: ${{ always() && needs.scheduled-cycle.outputs.continue_enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dispatch exactly one successor research turn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          SESSION_ID: ${{ needs.scheduled-cycle.outputs.session_id }}
          STARTED_AT_UTC: ${{ needs.scheduled-cycle.outputs.started_at_utc }}
          DEADLINE_AT_UTC: ${{ needs.scheduled-cycle.outputs.deadline_at_utc }}
          NEXT_ITERATION: ${{ needs.scheduled-cycle.outputs.next_iteration }}
        run: |
          python3 general_continuous_research.py dispatch \
            --repository "$GITHUB_REPOSITORY" \
            --session-id "$SESSION_ID" \
            --started-at-utc "$STARTED_AT_UTC" \
            --deadline-at-utc "$DEADLINE_AT_UTC" \
            --next-iteration "$NEXT_ITERATION"
