name: GENERAL 2026-11-05 Recovery Offline Tests

'on':
  push:
    paths:
      - "general_recovery_20261105.py"
      - "general_recovery_20261105_test.py"
      - ".github/workflows/general-recovery-20261105.yml"
      - ".github/workflows/general-recovery-20261105-test.yml"
      - "general_autonomous_research.py"
      - "general_autonomous_research_test.py"
      - "general_target_queue.py"
      - "general_target_queue_test.py"
      - "general_sealed_evaluation.py"
      - "general_nvidia_guard.py"
      - "docs/autonomous-research-scheduler.md"
      - ".github/workflows/general-autonomous-research.yml"
  pull_request:
    paths:
      - "general_recovery_20261105.py"
      - "general_recovery_20261105_test.py"
      - ".github/workflows/general-recovery-20261105.yml"
      - ".github/workflows/general-recovery-20261105-test.yml"
      - "general_autonomous_research.py"
      - "general_autonomous_research_test.py"
      - "general_target_queue.py"
      - "general_target_queue_test.py"
      - "general_sealed_evaluation.py"
      - "general_nvidia_guard.py"
      - "docs/autonomous-research-scheduler.md"
      - ".github/workflows/general-autonomous-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; %w[.github/workflows/general-recovery-20261105.yml .github/workflows/general-recovery-20261105-test.yml].each { |path| YAML.parse_file(path) }'
          echo "Recovery workflow YAML syntax: PASS"

      - name: Compile recovery and existing safety modules
        run: |
          python3 -m py_compile general_recovery_20261105.py general_recovery_20261105_test.py general_open_research.py general_autonomous_research.py general_sealed_evaluation.py general_nvidia_guard.py

      - name: Run offline recovery and regression suites
        run: |
          python3 -m unittest -v general_recovery_20261105_test general_open_research_test general_sealed_evaluation_test general_autonomous_research_test
