name: GENERAL One-Time NVIDIA Budget V2 to V3 Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight reports readiness without writing; migrate requires the exact approval phrase."
        required: true
        type: choice
        options:
          - preflight
          - migrate
        default: preflight
      approval:
        description: "Required only for mode=migrate."
        required: true
        type: string
        default: "NO"
      ruleset_bypass_confirmed:
        description: "Confirm in repository Settings > Rules > Rulesets that the budget Ruleset has exactly one Integration bypass actor: NVIDIA Budget Writer App ID 5861647, bypass mode always."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: read

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  migrate-budget-ledger:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce dispatch, Ruleset confirmation, and migration approval boundary
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
          RULESET_BYPASS_CONFIRMED: ${{ inputs.ruleset_bypass_confirmed }}
        run: |
          set -euo pipefail
          if [ "$RULESET_BYPASS_CONFIRMED" != "YES" ]; then
            echo "::error::Confirm the exact NVIDIA Budget Writer Ruleset bypass actor in repository Settings before running preflight or migration."
            exit 1
          fi
          echo "Operator confirmed Ruleset bypass actor: Integration ID 5861647, bypass mode always."
          case "$MODE" in
            preflight) ;;
            migrate)
              if [ "$APPROVAL" != "I_APPROVE_PERSIST_NVIDIA_BUDGET_V2_TO_V3" ]; then
                echo "::error::Migration mode requires the exact explicit approval phrase."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown migration mode."
              exit 1
              ;;
          esac

      - name: Checkout main source without persisting write credentials
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create the dedicated NVIDIA Budget Writer token
        id: nvidia-budget-writer
        uses: ./.github/actions/create-scoped-writer-token
        with:
          client_id: ${{ vars.GENERAL_NVIDIA_BUDGET_WRITER_APP_CLIENT_ID }}
          private_key: ${{ secrets.GENERAL_NVIDIA_BUDGET_WRITER_APP_PRIVATE_KEY }}
          writers_validated: ${{ vars.GENERAL_SCOPED_WRITERS_VALIDATED }}
          main_writer_client_id: ${{ vars.GENERAL_MAIN_WRITER_APP_CLIENT_ID }}
          budget_writer_client_id: ${{ vars.GENERAL_NVIDIA_BUDGET_WRITER_APP_CLIENT_ID }}
          allow_prevalidation_budget_migration: 'true'

      - name: Verify App identity, exact permissions, repository scope, and visible Ruleset configuration
        env:
          GENERAL_NVIDIA_BUDGET_WRITER_TOKEN: ${{ steps.nvidia-budget-writer.outputs.token }}
          GENERAL_NVIDIA_BUDGET_WRITER_APP_PRIVATE_KEY: ${{ secrets.GENERAL_NVIDIA_BUDGET_WRITER_APP_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 general_nvidia_writer_preflight.py

      - name: Preserve trusted main-branch migration code for the isolated budget worktree
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/general-nvidia-migration-source"
          mkdir -p "$SOURCE"
          cp general_nvidia_guard.py general_nvidia_budget_migrate.py general_writer_auth.py "$SOURCE/"
          echo "MIGRATION_SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Fetch and pin the protected budget branch in an isolated worktree
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(python3 -c 'import base64,os; print(base64.b64encode(("x-access-token:"+os.environ["READ_TOKEN"]).encode()).decode())')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch --no-tags origin refs/heads/general-nvidia-rate-limit-state:refs/remotes/origin/general-nvidia-rate-limit-state
          BASE_SHA="$(git rev-parse refs/remotes/origin/general-nvidia-rate-limit-state)"
          BUDGET_WORKTREE="$RUNNER_TEMP/general-nvidia-budget-worktree"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "BUDGET_WORKTREE=$BUDGET_WORKTREE" >> "$GITHUB_ENV"
          git worktree add --detach "$BUDGET_WORKTREE" "$BASE_SHA"
          test "$(git -C "$BUDGET_WORKTREE" rev-parse HEAD)" = "$BASE_SHA"
          test -f "$BUDGET_WORKTREE/general_nvidia_rate_limit.json"
          test "$(git -C "$GITHUB_WORKSPACE" branch --show-current)" = "main"
          test -f "$GITHUB_WORKSPACE/.github/actions/create-scoped-writer-token/action.yml"

      - name: Validate and convert the pinned ledger using trusted main-branch code
        id: migrate
        run: |
          set -euo pipefail
          cd "$BUDGET_WORKTREE"
          PYTHONPATH="$MIGRATION_SOURCE" python3 "$MIGRATION_SOURCE/general_nvidia_budget_migrate.py" --ledger general_nvidia_rate_limit.json | tee "$RUNNER_TEMP/budget-migration-report.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("general_nvidia_rate_limit.json").read_text(encoding="utf-8"))
          expected = {
              "forward_discovery": 750,
              "forward_critique": 225,
              "reverse_diagnostic": 150,
              "between_draws": 225,
              "retry_reserve": 150,
          }
          if value.get("schema_version") != 3 or value.get("daily_max_requests") != 1500:
              raise SystemExit("V3 schema or daily total validation failed")
          if value.get("category_limits") != expected:
              raise SystemExit("V3 category allocation validation failed")
          if "package_max_requests" in value:
              raise SystemExit("Legacy package cap remains in V3 ledger")
          print("V3 STRUCTURE: PASS")
          PY
          git diff --check
          CHANGED="$(git diff --name-only)"
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "general_nvidia_rate_limit.json" ]; then
            echo "::error::Unexpected file changes; refusing to continue."
            exit 1
          fi
          echo "CHANGED=$([ -n "$CHANGED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Report read-only preflight result
        if: ${{ inputs.mode == 'preflight' }}
        run: |
          {
            echo "## NVIDIA budget migration preflight"
            echo "- App identity, exact App permissions, installation repository scope, and budget Ruleset structure: PASS"
            echo "- Ruleset bypass actor: operator-confirmed Integration ID 5861647, bypass mode always."
            echo "- Pinned V2 ledger validation and V3 conversion preview: PASS"
            echo "- No commit or push was made."
            echo "- No NVIDIA API request, research, runtime-state, authorization, lock, or global writer-gate operation was performed."
            cat "$RUNNER_TEMP/budget-migration-report.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist V3 ledger with the NVIDIA Budget Writer only
        if: ${{ inputs.mode == 'migrate' && steps.migrate.outputs.CHANGED == 'true' }}
        env:
          GENERAL_NVIDIA_BUDGET_WRITER_TOKEN: ${{ steps.nvidia-budget-writer.outputs.token }}
        run: |
          set -euo pipefail
          cd "$BUDGET_WORKTREE"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- general_nvidia_rate_limit.json
          STAGED="$(git diff --cached --name-only)"
          if [ "$STAGED" != "general_nvidia_rate_limit.json" ]; then
            echo "::error::Staged path set is not exactly the budget ledger."
            exit 1
          fi
          git commit -m "Migrate NVIDIA budget ledger from schema v2 to v3"
          python3 "$MIGRATION_SOURCE/general_writer_auth.py" git-push --role nvidia_budget --remote origin --ref HEAD:general-nvidia-rate-limit-state
          echo "V2_TO_V3_PERSISTENCE: SUCCESS" >> "$GITHUB_STEP_SUMMARY"

      - name: Report already migrated ledger
        if: ${{ inputs.mode == 'migrate' && steps.migrate.outputs.CHANGED == 'false' }}
        run: |
          echo "Ledger already validates as schema v3. No commit or push was made." >> "$GITHUB_STEP_SUMMARY"

      - name: Migration audit summary
        if: always()
        run: |
          echo "## NVIDIA budget migration audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow is migration-only; no NVIDIA API request is made." >> "$GITHUB_STEP_SUMMARY"
          echo "- No research, runtime-state, authorization, global lock, or global writer-gate operation is performed." >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/budget-migration-report.txt" ]; then
            cat "$RUNNER_TEMP/budget-migration-report.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
