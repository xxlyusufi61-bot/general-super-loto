name: GENERAL NVIDIA Safety Tests

on:
  push:
    branches:
      - main
      - fix/locked-diagnostic-run-authorized-one-shot-20261102
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline safety-lock and automation-state contract tests
        run: |
          python3 -m py_compile general_automation_state.py general_automation_state_test.py general_automation_state_reader.py general_automation_state_reader_test.py general_automation_state_sync.py general_automation_state_sync_test.py
          python3 -m unittest discover -s tests -v
          python3 -m unittest -v general_automation_state_test general_automation_state_reader_test general_automation_state_sync_test general_autonomous_research_test general_live_consent_test general_agent_workflow_guard_test

      - name: Verify the real state branch through read-only GitHub API calls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 general_automation_state_reader.py

      - name: Compare real main and state-store objects in read-only shadow mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python3 general_automation_state_reader.py --shadow-compare > /tmp/general-state-shadow-ci.json 2>&1
          shadow_status=$?
          set -e
          if [ -s /tmp/general-state-shadow-ci.json ]; then
            cat /tmp/general-state-shadow-ci.json
            cat /tmp/general-state-shadow-ci.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$shadow_status" -eq 2 ]; then
            echo "::warning::State-store divergence found; shadow mode does not change main or fail safety CI."
          elif [ "$shadow_status" -ne 0 ]; then
            echo "::warning::Shadow comparison could not complete; main remains authoritative."
          fi

      - name: Checkout the exact main base for PR preflight
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: preflight-main
          fetch-depth: 1

      - name: Run read-only state-sync preflight against pinned PR base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 general_automation_state_sync.py --expected-main-commit "$GITHUB_SHA" --source-root preflight-main

      - name: Run read-only state-sync preflight on the pinned main snapshot
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 general_automation_state_sync.py --expected-main-commit "$GITHUB_SHA"
