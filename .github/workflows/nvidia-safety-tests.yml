name: GENERAL NVIDIA Safety Tests

'on':
  push:
    branches:
      - main
      - fix/locked-diagnostic-run-authorized-one-shot-20261102
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline safety-lock and automation-state contract tests
        run: |
          python3 -m py_compile general_automation_state.py general_automation_state_test.py general_automation_state_reader.py general_automation_state_reader_test.py general_automation_state_sync.py general_automation_state_sync_test.py general_automation_state_writer.py general_automation_state_writer_test.py general_automation_state_runtime_audit.py general_automation_state_runtime_audit_test.py general_automation_state_cutover_workflow_test.py
          python3 -m unittest discover -s tests -v
          python3 -m unittest -v general_automation_state_test general_automation_state_reader_test general_automation_state_sync_test general_automation_state_writer_test general_automation_state_runtime_audit_test general_automation_state_cutover_workflow_test general_autonomous_research_test general_live_consent_test general_agent_workflow_guard_test

      - name: Verify the real state branch through read-only GitHub API calls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 general_automation_state_reader.py

      - name: Run active authoritative state-store integrity audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 general_automation_state_runtime_audit.py --state-authoritative
