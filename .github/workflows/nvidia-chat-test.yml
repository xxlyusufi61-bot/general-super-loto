name: GENERAL AI Chat Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ask NVIDIA AI model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          key = os.environ.get("NVIDIA_API_KEY", "")

          if not key:
              raise SystemExit("NVIDIA_API_KEY secret is missing")

          payload = {
              "model": "z-ai/glm-5.3-flash",
              "messages": [
                  {
                      "role": "user",
                      "content": "Türkçe cevap ver: GENERAL nedir?"
                  }
              ],
              "max_tokens": 200,
              "temperature": 0.2,
              "stream": False
          }

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=240
              ) as response:
                  response_text = response.read().decode("utf-8")

              data = json.loads(response_text)

              if not isinstance(data, dict):
                  raise RuntimeError(
                      "API response is not a JSON object"
                  )

              choices = data.get("choices")

              if not isinstance(choices, list) or not choices:
                  raise RuntimeError(
                      "API returned no choices"
                  )

              choice = choices[0]

              if not isinstance(choice, dict):
                  raise RuntimeError(
                      "API returned an invalid choice"
                  )

              message = choice.get("message")

              if not isinstance(message, dict):
                  raise RuntimeError(
                      "API returned no valid message"
                  )

              # Only the final user-facing content is accepted.
              answer = message.get("content")

              if not isinstance(answer, str) or not answer.strip():
                  print("Final answer content is missing.")
                  print("Available message fields:", sorted(message.keys()))
                  print("Finish reason:", choice.get("finish_reason"))
                  raise SystemExit(1)

              print("GENERAL AI CHAT TEST SUCCESS")
              print("Model:", data.get("model", "not specified"))
              print("Final answer received: YES")
              print("Answer:", answer.strip())

          except urllib.error.HTTPError as error:
              print("NVIDIA API HTTP status:", error.code)
              print("Response body omitted from logs.")
              raise SystemExit(1)

          except json.JSONDecodeError:
              print("Test failed: API response was not valid JSON.")
              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("Test failed: Network request error.")
              print("Error type:", type(error.reason).__name__)
              raise SystemExit(1)

          except SystemExit:
              raise

          except Exception as error:
              print("Test failed:", type(error).__name__)
              raise SystemExit(1)
          PY
