name: GENERAL AI Chat Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  chat-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check global NVIDIA safety lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_nvidia_guard.py check

      - name: Ask NVIDIA AI model
        id: nvidia-chat-request
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request
          import urllib.error

          key = os.environ.get("NVIDIA_API_KEY", "")

          if not key:
              raise SystemExit("NVIDIA_API_KEY secret is missing")

          payload = {
              "model": "z-ai/glm-5.3-flash",
              "messages": [
                  {
                      "role": "user",
                      "content": "Türkçe ve kısa cevap ver: GENERAL nedir?"
                  }
              ],
              "max_tokens": 1024,
              "temperature": 0.2,
              "reasoning_effort": "low",
              "chat_template_kwargs": {
                  "clear_thinking": True
              },
              "stream": False
          }

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          Path("/tmp/general_nvidia_api_attempted").touch()

          try:
              with urllib.request.urlopen(
                  request, timeout=240
              ) as response:
                  response_text = response.read().decode("utf-8")

              try:
                  data = json.loads(response_text)
              except json.JSONDecodeError:
                  raise RuntimeError("API response was not valid JSON")

              if not isinstance(data, dict):
                  raise RuntimeError("API response was not a JSON object")

              choices = data.get("choices")

              if not isinstance(choices, list) or not choices:
                  raise RuntimeError("API returned no choices")

              choice = choices[0]

              if not isinstance(choice, dict):
                  raise RuntimeError("API returned an invalid choice")

              message = choice.get("message")

              if not isinstance(message, dict):
                  raise RuntimeError("API returned no valid message")

              answer = message.get("content")
              finish_reason = choice.get("finish_reason")

              if not isinstance(answer, str) or not answer.strip():
                  print("GENERAL AI CHAT TEST FAILURE")
                  print("Final answer content is empty.")
                  print("Finish reason:", finish_reason)
                  print("Available message fields:", sorted(message.keys()))

                  if finish_reason == "length":
                      print(
                          "The model reached its token limit "
                          "before producing a final answer."
                      )

                  raise SystemExit(1)

              if finish_reason == "length":
                  print(
                      "WARNING: The answer may have been cut off "
                      "by the token limit."
                  )

              Path("/tmp/general_nvidia_api_succeeded").touch()

          print("GENERAL AI CHAT TEST SUCCESS")
              print("Model:", data.get("model", "not specified"))
              print("Finish reason:", finish_reason)
              print("Final answer received: YES")
              print("Answer:", answer.strip())

          except urllib.error.HTTPError as error:
              print("NVIDIA API HTTP status:", error.code)
              try:
                  detail = error.read(1500).decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(detail)
                      safe_error = parsed.get("detail", parsed.get("error", parsed))
                      print("NVIDIA API error detail:", json.dumps(safe_error, ensure_ascii=False)[:1500])
                  except Exception:
                      print("NVIDIA API error detail:", detail[:1500])
              except Exception:
                  print("NVIDIA API error detail: unavailable")
              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("Network request failed:", type(error.reason).__name__)
              raise SystemExit(1)

          except SystemExit:
              raise

          except Exception as error:
              print("Test failed:", type(error).__name__, str(error)[:200])
              raise SystemExit(1)
          PY

      - name: Activate global lock after NVIDIA request failure
        if: ${{ failure() && steps.nvidia-chat-request.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f /tmp/general_nvidia_api_attempted ] && [ ! -f /tmp/general_nvidia_api_succeeded ]; then
            python3 general_nvidia_guard.py lock --reason "NVIDIA chat test request failed or returned an unvalidated response; global pause is required because cause is uncertain."
          else
            echo "No incomplete NVIDIA API request detected; global lock unchanged."
          fi
