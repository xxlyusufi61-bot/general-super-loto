name: GENERAL AI Chat Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ask NVIDIA AI model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          key = os.environ.get("NVIDIA_API_KEY", "")
          if not key:
              raise SystemExit("NVIDIA_API_KEY secret is missing")

          payload = {
              "model": "z-ai/glm-5.3-flash",
              "messages": [
                  {
                      "role": "user",
                      "content": "Türkçe cevap ver: GENERAL nedir?"
                  }
              ],
              "max_tokens": 200,
              "temperature": 0.2,
              "stream": False
          }

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=240) as response:
                  data = json.loads(response.read().decode("utf-8"))

              print("API RESPONSE:")
              print(json.dumps(data, ensure_ascii=False)[:5000])

              choices = data.get("choices", [])
              if not choices:
                  raise RuntimeError("API returned no choices")

              message = choices[0].get("message") or {}
              answer = message.get("content")

              if not answer:
                  answer = message.get("reasoning_content")

              if not answer:
                  answer = message.get("reasoning")

              if answer:
                  print("GENERAL AI CHAT TEST SUCCESS")
                  print("Model:", data.get("model"))
                  print("Answer:", answer)
              else:
                  print("No text answer found.")
                  print("Message fields:", list(message.keys()))
                  print("Finish reason:", choices[0].get("finish_reason"))
                  raise SystemExit(1)

          except urllib.error.HTTPError as error:
              print("NVIDIA API HTTP status:", error.code)
              print(error.read().decode("utf-8")[:1500])
              raise SystemExit(1)
          except Exception as error:
              print("Test failed:", type(error).__name__, str(error)[:500])
              raise SystemExit(1)
          PY
