name: GENERAL AI Chat Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ask NVIDIA AI model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import socket

          key = os.environ.get("NVIDIA_API_KEY", "")
          if not key:
              raise SystemExit("NVIDIA_API_KEY secret is missing")

          payload = {
              "model": "z-ai/glm-5.3-flash",
              "messages": [
                  {
                      "role": "user",
                      "content": "Türkçe, tek cümleyle açıkla: GENERAL nedir?"
                  }
              ],
              "max_tokens": 60,
              "temperature": 0.2,
              "stream": False
          }

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=240) as response:
                  data = json.loads(response.read().decode("utf-8"))

              choices = data.get("choices", [])
              if not choices:
                  raise RuntimeError("API returned no answer")

              answer = choices[0].get("message", {}).get("content", "")
              print("GENERAL AI CHAT TEST SUCCESS")
              print("Model:", data.get("model", payload["model"]))
              print("Answer:", answer)

              if not answer:
                  raise RuntimeError("Model answer is empty")

          except urllib.error.HTTPError as error:
              print("NVIDIA API HTTP status:", error.code)
              print(error.read().decode("utf-8")[:1200])
              raise SystemExit(1)
          except (TimeoutError, socket.timeout):
              raise SystemExit(
                  "NVIDIA API timed out; the model may be busy or unavailable."
              )
          except Exception as error:
              print("Test failed:", type(error).__name__, str(error)[:500])
              raise SystemExit(1)
          PY
