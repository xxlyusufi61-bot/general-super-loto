name: GENERAL AI Chat Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ask NVIDIA AI model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          key = os.environ.get("NVIDIA_API_KEY", "")
          if not key:
              raise SystemExit(
                  "ERROR: NVIDIA_API_KEY secret is missing"
              )

          payload = {
              "model": "z-ai/glm-5.3-flash",
              "messages": [
                  {
                      "role": "system",
                      "content": "You are GENERAL, a concise AI assistant."
                  },
                  {
                      "role": "user",
                      "content": (
                          "Türkçe cevap ver: "
                          "GENERAL nedir? Tek kısa cümle yaz."
                      )
                  }
              ],
              "max_tokens": 120,
              "temperature": 0.2,
              "stream": False
          }

          request = urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=90
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              choices = data.get("choices", [])
              if not choices:
                  raise RuntimeError(
                      "API response contains no choices"
                  )

              answer = (
                  choices[0].get("message", {}).get("content", "")
              )

              if not answer:
                  raise RuntimeError("Model returned an empty answer")

              print("GENERAL AI CHAT TEST SUCCESS")
              print("Model:", data.get("model", payload["model"]))
              print("Model answer:")
              print(answer)

          except urllib.error.HTTPError as error:
              print("NVIDIA API HTTP status:", error.code)
              print(error.read().decode("utf-8")[:1500])
              raise SystemExit(1)

          except Exception as error:
              print("Test failed:", type(error).__name__, str(error))
              raise SystemExit(1)
          PY 
