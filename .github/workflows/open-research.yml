name: GENERAL Blank-Slate Research

'on':
  push:
    branches:
      - main
      - feature/blank-slate-research-20261025
    paths:
      - "general_open_research.py"
      - "requirements.txt"
      - "general_nvidia_guard.py"
      - "general_live_consent.py"
      - "general_open_research_test.py"
      - "general_single_request_token_test.py"
      - "general_single_request_token_test_test.py"
      - "general_hypothesis_execution.py"
      - "general_hypothesis_execution_test.py"
      - "general_execution_spec_dispatch.py"
      - "general_execution_spec_dispatch_test.py"
      - "general_hypothesis_execution_v2.py"
      - "general_hypothesis_execution_v2_test.py"
      - "general_sealed_evaluation_v2_test.py"
      - "docs/safe-hypothesis-execution-v2.md"
      - "general_bidirectional_evaluation.py"
      - "general_bidirectional_evaluation_test.py"
      - "general_execution_spec_parser.py"
      - "general_execution_spec_parser_test.py"
      - "general_sealed_evaluation.py"
      - "general_sealed_evaluation_test.py"
      - "general_evaluation_ledger.json"
      - "general_source_context.py"
      - "general_source_context_test.py"
      - "docs/sealed-evaluation-orchestration.md"
      - "general_hypothesis_proposals.py"
      - "general_hypothesis_proposals_test.py"
      - "docs/safe-hypothesis-execution.md"
      - "general_research_memory.py"
      - "general_research_memory_test.py"
      - "general_offline_hypothesis_discovery.py"
      - "general_offline_hypothesis_discovery_test.py"
      - "docs/general-offline-hypothesis-discovery.md"
      - "general_research_memory.json"
      - "docs/general-research-memory.md"
      - ".github/workflows/open-research.yml"
      - ".github/workflows/general-autonomous-research.yml"
      - "general_autonomous_research.py"
      - "general_autonomous_research_test.py"
      - "general_target_queue.py"
      - "general_target_queue_test.py"
  pull_request:
    branches:
      - main
      - fix/research-contract-memory-dsl-20261109
      - feat/general-budget-queue-72-20261109
    paths:
      - "general_open_research.py"
      - "requirements.txt"
      - "general_nvidia_guard.py"
      - "general_live_consent.py"
      - "general_open_research_test.py"
      - "general_single_request_token_test.py"
      - "general_single_request_token_test_test.py"
      - "general_hypothesis_execution.py"
      - "general_hypothesis_execution_test.py"
      - "general_execution_spec_dispatch.py"
      - "general_execution_spec_dispatch_test.py"
      - "general_hypothesis_execution_v2.py"
      - "general_hypothesis_execution_v2_test.py"
      - "general_sealed_evaluation_v2_test.py"
      - "docs/safe-hypothesis-execution-v2.md"
      - "general_bidirectional_evaluation.py"
      - "general_bidirectional_evaluation_test.py"
      - "general_execution_spec_parser.py"
      - "general_execution_spec_parser_test.py"
      - "general_sealed_evaluation.py"
      - "general_sealed_evaluation_test.py"
      - "general_evaluation_ledger.json"
      - "general_source_context.py"
      - "general_source_context_test.py"
      - "docs/sealed-evaluation-orchestration.md"
      - "general_hypothesis_proposals.py"
      - "general_hypothesis_proposals_test.py"
      - "docs/safe-hypothesis-execution.md"
      - "general_research_memory.py"
      - "general_research_memory_test.py"
      - "general_offline_hypothesis_discovery.py"
      - "general_offline_hypothesis_discovery_test.py"
      - "docs/general-offline-hypothesis-discovery.md"
      - "general_research_memory.json"
      - "docs/general-research-memory.md"
      - ".github/workflows/open-research.yml"
      - ".github/workflows/general-autonomous-research.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "Optional research focus (must not request number predictions)"
        required: false
        type: string
        default: "Explore the pre-target archive from scratch and propose testable hypotheses."
      confirm_live_calls:
        description: "Leave NO to block all live calls. The exact free-only phrase authorizes at most four NVIDIA requests in this job package; use it only after verifying there is no paid-charge risk."
        required: true
        type: string
        default: "NO"
      confirm_free_usage_verified:
        description: "Only true if NVIDIA account UI and current terms clearly verify BOTH planned directional requests are within free use with no paid charge risk. If only rate limits are visible and free allowance cannot be verified, leave false."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned NVIDIA OpenAI SDK
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Compile and test blank-slate runner
        run: |
          python3 -m py_compile general_autonomous_research.py general_autonomous_research_test.py general_target_queue.py general_target_queue_test.py general_open_research.py general_open_research_test.py general_hypothesis_proposals.py general_hypothesis_proposals_test.py general_hypothesis_execution.py general_hypothesis_execution_test.py general_execution_spec_dispatch.py general_execution_spec_dispatch_test.py general_hypothesis_execution_v2.py general_hypothesis_execution_v2_test.py general_bidirectional_evaluation.py general_bidirectional_evaluation_test.py general_execution_spec_parser.py general_execution_spec_parser_test.py general_sealed_evaluation.py general_sealed_evaluation_test.py general_sealed_evaluation_v2_test.py general_source_context.py general_source_context_test.py general_research_memory.py general_research_memory_test.py general_offline_hypothesis_discovery.py general_offline_hypothesis_discovery_test.py general_single_request_token_test.py general_single_request_token_test_test.py
          python3 -m unittest -v general_live_consent_test general_hypothesis_proposals_test general_open_research_test general_target_queue_test general_autonomous_research_test general_single_request_token_test_test general_hypothesis_execution_test general_execution_spec_dispatch_test general_hypothesis_execution_v2_test general_bidirectional_evaluation_test general_execution_spec_parser_test general_sealed_evaluation_test general_sealed_evaluation_v2_test general_source_context_test general_research_memory_test general_offline_hypothesis_discovery_test

  research:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_4_NVIDIA_REQUESTS' && inputs.confirm_free_usage_verified == true }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned NVIDIA OpenAI SDK
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt
      - name: Hydrate verified GENERAL state-store data
        id: state_bootstrap
        uses: ./.github/actions/hydrate-automation-state
        with:
          token: ${{ github.token }}
      - name: Verify active state-store authority and global safety lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 general_automation_state_integrity_audit.py
      - name: Check global NVIDIA safety lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 general_nvidia_guard.py check
          echo "GENERAL_NVIDIA_GUARD_PASSED=1" >> "$GITHUB_ENV"
      - name: Refresh and validate archive
        id: refresh-archive
        run: |
          if python3 general_archive_fetch.py > /tmp/archive-fetch.log 2>&1; then
            echo "Archive retrieval completed."
          else
            echo "Archive retrieval failed; research stopped."
            exit 1
          fi
      - name: Publish refreshed archive to the state store
        id: publish-archive
        uses: ./.github/actions/publish-automation-state
        with:
          token: ${{ github.token }}
          expected_generation: ${{ steps.state_bootstrap.outputs.generation }}
          objects: archive
          message: "Refresh validated Super Loto archive"
      - name: Preflight both sealed directional intervals before hosted inference
        run: |
          python3 general_sealed_evaluation.py preflight --archive super_loto_archive.json --ledger general_evaluation_ledger.json
      - name: Run separate forward and reverse blank-slate discovery requests
        id: nvidia-research
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TASK_TEXT: ${{ inputs.task }}
          GENERAL_CONFIRM_LIVE_CALLS: ${{ inputs.confirm_live_calls }}
          GENERAL_ALLOW_NVIDIA_CALL: "true"
          GENERAL_NVIDIA_FREE_USAGE_VERIFIED: "true"
        run: |
          python3 general_open_research.py
      - name: Claim one sealed interval before real-archive scoring
        id: sealed-claim
        if: ${{ success() }}
        run: |
          python3 general_sealed_evaluation.py claim \
            --archive super_loto_archive.json \
            --ledger general_evaluation_ledger.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --output open_research_evaluation_claim.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Persist immutable sealed archive snapshot on main
        id: persist-sealed-snapshot
        if: ${{ steps.sealed-claim.outputs.claim_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general_evaluation_snapshots/
          git commit -m "Store immutable Super Loto evaluation snapshot"
          git push origin HEAD:main
      - name: Publish sealed claim to the state store
        id: persist-sealed-claim
        if: ${{ steps.sealed-claim.outputs.claim_created == 'true' }}
        uses: ./.github/actions/publish-automation-state
        with:
          token: ${{ github.token }}
          expected_generation: ${{ steps.publish-archive.outputs.generation }}
          objects: evaluation_ledger
          message: "Reserve one-shot Super Loto validation interval"
      - name: Run one-shot chronological evaluation
        id: sealed-evaluation
        if: ${{ steps.sealed-claim.outputs.claim_created == 'true' }}
        env:
          SEALED_CLAIM_ID: ${{ steps.sealed-claim.outputs.claim_id }}
        run: |
          python3 general_sealed_evaluation.py evaluate \
            --claim-id "$SEALED_CLAIM_ID" \
            --ledger general_evaluation_ledger.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --output open_research_evaluation_report.json
      - name: Publish evaluation completion to the state store
        id: persist-sealed-evaluation
        if: ${{ success() && steps.sealed-claim.outputs.claim_created == 'true' }}
        uses: ./.github/actions/publish-automation-state
        with:
          token: ${{ github.token }}
          expected_generation: ${{ steps.persist-sealed-claim.outputs.generation }}
          objects: evaluation_ledger
          message: "Record sealed evaluation completion"
      - name: Activate global lock after an incomplete NVIDIA research request
        if: ${{ failure() && steps.nvidia-research.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          incomplete_request=false
          for request_label in forward reverse forward_critique between_draws unlabelled; do
            if [ -f "/tmp/general_nvidia_api_attempted_${request_label}" ] && [ ! -f "/tmp/general_nvidia_api_succeeded_${request_label}" ]; then
              incomplete_request=true
            fi
          done
          if [ "$incomplete_request" = "true" ]; then
            python3 general_nvidia_guard.py lock --reason "GENERAL blank-slate NVIDIA request delivery or validation is uncertain; global safety pause is required. No automatic retry is permitted."
          else
            echo "No incomplete provider request detected; global lock unchanged."
          fi
      - name: Submit a structured rule-change request for Telegram approval if proposed
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_rule_change.py submit-report --report open_research_report.md

      - name: Append sanitized GENERAL research memory
        if: ${{ always() && (steps.nvidia-research.outcome == 'success' || steps.nvidia-research.outcome == 'failure') }}
        env:
          NVIDIA_OUTCOME: ${{ steps.nvidia-research.outcome }}
          CLAIM_OUTCOME: ${{ steps.sealed-claim.outcome }}
          CLAIM_PERSIST_OUTCOME: ${{ steps.persist-sealed-claim.outcome }}
          EVALUATION_OUTCOME: ${{ steps.sealed-evaluation.outcome }}
        run: |
          failure_stage=""
          if [ "$NVIDIA_OUTCOME" = "failure" ]; then
            echo "The research runner records the precise failed direction and stage."
          elif [ "$CLAIM_OUTCOME" = "failure" ]; then
            failure_stage="sealed_claim"
          elif [ "$CLAIM_PERSIST_OUTCOME" = "failure" ]; then
            failure_stage="sealed_claim_persistence"
          elif [ "$EVALUATION_OUTCOME" = "failure" ]; then
            failure_stage="sealed_evaluation"
          fi
          if python3 general_research_memory.py record-cycle \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --failure-stage "$failure_stage" \
            --error-type "WorkflowStepFailure"; then
            :
          else
            echo "GENERAL research-memory append failed; the existing ledger and target isolation were not modified."
            exit 1
          fi
          echo "Research-memory candidate prepared for the dedicated state-store commit."

      - name: Publish sanitized GENERAL research memory
        id: persist-research-memory
        if: ${{ always() && (steps.nvidia-research.outcome == 'success' || steps.nvidia-research.outcome == 'failure') }}
        uses: ./.github/actions/publish-automation-state
        with:
          token: ${{ github.token }}
          expected_generation: ${{ steps.persist-sealed-evaluation.outputs.generation || steps.persist-sealed-claim.outputs.generation || steps.publish-archive.outputs.generation || steps.state_bootstrap.outputs.generation }}
          objects: research_memory
          message: "Record sanitized GENERAL directional research memory"

      - name: Upload direction-isolated hypothesis reports and safe metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: general-blank-slate-research-report
          path: |
            open_research_report.md
            open_research_forward_report.md
            open_research_reverse_report.md
            open_research_proposals.json
            open_research_execution_specs.json
            open_research_usage.json
            open_research_usage_forward.json
            open_research_usage_reverse.json
            open_research_sealed_plan.json
            open_research_evaluation_claim.json
            open_research_evaluation_report.json
            open_research_run_status.json
            general_evaluation_ledger.json
          if-no-files-found: ignore
          retention-days: 14
