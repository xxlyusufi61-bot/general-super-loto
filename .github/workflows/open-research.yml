name: GENERAL Blank-Slate Research

'on':
  push:
    branches:
      - main
      - feature/blank-slate-research-20261025
    paths:
      - "general_open_research.py"
      - "general_nvidia_guard.py"
      - "general_live_consent.py"
      - "general_open_research_test.py"
      - "general_hypothesis_execution.py"
      - "general_hypothesis_execution_test.py"
      - "general_bidirectional_evaluation.py"
      - "general_bidirectional_evaluation_test.py"
      - "general_bidirectional_evaluation.py"
      - "general_bidirectional_evaluation_test.py"
      - "general_execution_spec_parser.py"
      - "general_execution_spec_parser_test.py"
      - "general_sealed_evaluation.py"
      - "general_sealed_evaluation_test.py"
      - "general_evaluation_ledger.json"
      - "general_source_context.py"
      - "general_source_context_test.py"
      - "docs/sealed-evaluation-orchestration.md"
      - "general_hypothesis_proposals.py"
      - "general_hypothesis_proposals_test.py"
      - "docs/safe-hypothesis-execution.md"
      - ".github/workflows/open-research.yml"
  pull_request:
    branches:
      - main
    paths:
      - "general_open_research.py"
      - "general_nvidia_guard.py"
      - "general_live_consent.py"
      - "general_open_research_test.py"
      - "general_hypothesis_execution.py"
      - "general_hypothesis_execution_test.py"
      - "general_bidirectional_evaluation.py"
      - "general_bidirectional_evaluation_test.py"
      - "general_execution_spec_parser.py"
      - "general_execution_spec_parser_test.py"
      - "general_sealed_evaluation.py"
      - "general_sealed_evaluation_test.py"
      - "general_evaluation_ledger.json"
      - "general_source_context.py"
      - "general_source_context_test.py"
      - "docs/sealed-evaluation-orchestration.md"
      - "general_hypothesis_proposals.py"
      - "general_hypothesis_proposals_test.py"
      - "docs/safe-hypothesis-execution.md"
      - ".github/workflows/open-research.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "Optional research focus (must not request number predictions)"
        required: false
        type: string
        default: "Explore the pre-target archive from scratch and propose testable hypotheses."
      confirm_live_calls:
        description: "Leave NO to block all live calls. Type the exact free-only confirmation phrase only after manually verifying there is no paid-charge risk."
        required: true
        type: string
        default: "NO"
      confirm_free_usage_verified:
        description: "Only true if NVIDIA's account UI and current terms clearly verify this single hosted request is within free use with no paid charge risk. If only rate limits are visible and free allowance cannot be verified, leave false."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: general-nvidia-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test blank-slate runner
        run: |
          python3 -m py_compile general_open_research.py general_open_research_test.py general_hypothesis_proposals.py general_hypothesis_proposals_test.py general_hypothesis_execution.py general_hypothesis_execution_test.py general_bidirectional_evaluation.py general_bidirectional_evaluation_test.py general_execution_spec_parser.py general_execution_spec_parser_test.py general_sealed_evaluation.py general_sealed_evaluation_test.py general_source_context.py general_source_context_test.py
          python3 -m unittest -v general_hypothesis_proposals_test general_open_research_test general_hypothesis_execution_test general_bidirectional_evaluation_test general_execution_spec_parser_test general_sealed_evaluation_test general_source_context_test

  research:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_live_calls == 'I_CONFIRM_FREE_ONLY_NO_BILLING_AND_APPROVE_UP_TO_3_NVIDIA_REQUESTS' && inputs.confirm_free_usage_verified == true }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check global NVIDIA safety lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 general_nvidia_guard.py check
          echo "GENERAL_NVIDIA_GUARD_PASSED=1" >> "$GITHUB_ENV"
      - name: Refresh archive
        run: |
          if python3 general_archive_fetch.py > /tmp/archive-fetch.log 2>&1; then
            echo "Archive retrieval completed."
          else
            echo "Archive retrieval failed; research stopped."
            exit 1
          fi
      - name: Preflight one-shot sealed interval before hosted inference
        run: |
          python3 general_sealed_evaluation.py preflight --archive super_loto_archive.json --ledger general_evaluation_ledger.json
      - name: Run isolated blank-slate exploration
        id: nvidia-research
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TASK_TEXT: ${{ inputs.task }}
          GENERAL_CONFIRM_LIVE_CALLS: ${{ inputs.confirm_live_calls }}
          GENERAL_ALLOW_NVIDIA_CALL: "true"
          GENERAL_NVIDIA_FREE_USAGE_VERIFIED: "true"
        run: |
          python3 general_open_research.py
      - name: Claim one sealed interval before real-archive scoring
        id: sealed-claim
        if: ${{ success() }}
        run: |
          python3 general_sealed_evaluation.py claim \
            --archive super_loto_archive.json \
            --ledger general_evaluation_ledger.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --output open_research_evaluation_claim.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Persist sealed claim and immutable archive snapshot before evaluation
        if: ${{ steps.sealed-claim.outputs.claim_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add general_evaluation_ledger.json general_evaluation_snapshots/
          git commit -m "Reserve one-shot Super Loto validation interval"
          git push origin HEAD:main
      - name: Run one-shot chronological evaluation
        id: sealed-evaluation
        if: ${{ steps.sealed-claim.outputs.claim_created == 'true' }}
        env:
          SEALED_CLAIM_ID: ${{ steps.sealed-claim.outputs.claim_id }}
        run: |
          python3 general_sealed_evaluation.py evaluate \
            --claim-id "$SEALED_CLAIM_ID" \
            --ledger general_evaluation_ledger.json \
            --proposals open_research_proposals.json \
            --specs open_research_execution_specs.json \
            --output open_research_evaluation_report.json
      - name: Persist evaluation completion without draw-level values
        if: ${{ success() && steps.sealed-claim.outputs.claim_created == 'true' }}
        run: |
          git add general_evaluation_ledger.json
          git commit -m "Record sealed evaluation completion"
          git push origin HEAD:main
      - name: Activate global lock after an incomplete NVIDIA research request
        if: ${{ failure() && steps.nvidia-research.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERAL_DEFAULT_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f /tmp/general_nvidia_api_attempted ] && [ ! -f /tmp/general_nvidia_api_succeeded ]; then
            python3 general_nvidia_guard.py lock --reason "GENERAL blank-slate NVIDIA request failed or its response could not be validated; global safety pause is required because quota, authorization, billing/limit, or service state is uncertain."
          else
            echo "No incomplete NVIDIA request detected; global lock unchanged."
          fi
      - name: Submit a structured rule-change request for Telegram approval if proposed
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 general_rule_change.py submit-report --report open_research_report.md
      - name: Upload hypothesis report only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: general-blank-slate-research-report
          path: |
            open_research_report.md
            open_research_proposals.json
            open_research_execution_specs.json
            open_research_usage.json
            open_research_sealed_plan.json
            open_research_evaluation_claim.json
            open_research_evaluation_report.json
            general_evaluation_ledger.json
          if-no-files-found: ignore
          retention-days: 14
