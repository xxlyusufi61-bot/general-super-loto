name: Create scoped GENERAL writer token
description: Mint a short-lived, single-repository GitHub App token with contents write only.
inputs:
  client_id:
    description: Client ID for the dedicated writer GitHub App.
    required: true
  private_key:
    description: Private key for the dedicated writer GitHub App.
    required: true
  writers_validated:
    description: Explicit repository deployment-gate value supplied by the calling workflow.
    required: false
    default: 'false'
  main_writer_client_id:
    description: Configured Main Writer App client ID supplied by the calling workflow.
    required: false
    default: ''
  budget_writer_client_id:
    description: Configured NVIDIA Budget Writer App client ID supplied by the calling workflow.
    required: false
    default: ''
  allow_prevalidation_safety_lock:
    description: Allow only an explicitly allowlisted Main Writer safety-lock operation before deployment validation.
    required: false
    default: 'false'
  allow_prevalidation_budget_migration:
    description: Allow only the dedicated NVIDIA Budget Writer in the exact one-shot migration workflow before the global writer gate is enabled.
    required: false
    default: 'false'
outputs:
  token:
    description: Short-lived installation token scoped to this repository and contents write.
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Verify scoped writer deployment gate
      shell: bash
      env:
        WRITERS_VALIDATED: ${{ inputs.writers_validated }}
        ALLOW_PREVALIDATION_SAFETY_LOCK: ${{ inputs.allow_prevalidation_safety_lock }}
        ALLOW_PREVALIDATION_BUDGET_MIGRATION: ${{ inputs.allow_prevalidation_budget_migration }}
        REQUESTED_CLIENT_ID: ${{ inputs.client_id }}
        MAIN_WRITER_CLIENT_ID: ${{ inputs.main_writer_client_id }}
        BUDGET_WRITER_CLIENT_ID: ${{ inputs.budget_writer_client_id }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        WRITERS_VALIDATED="${WRITERS_VALIDATED:-false}"
        ALLOW_PREVALIDATION_BUDGET_MIGRATION="${ALLOW_PREVALIDATION_BUDGET_MIGRATION:-false}"
        ALLOW_PREVALIDATION_SAFETY_LOCK="${ALLOW_PREVALIDATION_SAFETY_LOCK:-false}"
        BUDGET_WRITER_CLIENT_ID="${BUDGET_WRITER_CLIENT_ID:-}"
        MAIN_WRITER_CLIENT_ID="${MAIN_WRITER_CLIENT_ID:-}"
        if [ "$WRITERS_VALIDATED" = "true" ]; then
          echo "SCOPED WRITER DEPLOYMENT GATE: PASS"
          exit 0
        fi
        if [ "$ALLOW_PREVALIDATION_BUDGET_MIGRATION" = "true" ]; then
          if [ -z "$BUDGET_WRITER_CLIENT_ID" ] || [ "$REQUESTED_CLIENT_ID" != "$BUDGET_WRITER_CLIENT_ID" ]; then
            echo "::error::Pre-validation migration exception is restricted to the configured NVIDIA Budget Writer identity."
            exit 1
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$WORKFLOW_REF" != "xxlyusufi61-bot/general-super-loto/.github/workflows/general-nvidia-budget-migration.yml@refs/heads/main" ]; then
            echo "::error::Pre-validation migration exception is restricted to the exact manual main-branch migration workflow."
            exit 1
          fi
          echo "SCOPED WRITER DEPLOYMENT GATE: narrow NVIDIA Budget Writer migration exception"
          exit 0
        fi
        if [ "$ALLOW_PREVALIDATION_SAFETY_LOCK" = "true" ]; then
          if [ -z "$MAIN_WRITER_CLIENT_ID" ] || [ "$REQUESTED_CLIENT_ID" != "$MAIN_WRITER_CLIENT_ID" ]; then
            echo "::error::Pre-validation exception is restricted to the configured Main Writer identity."
            exit 1
          fi
          case "$WORKFLOW_REF" in
            xxlyusufi61-bot/general-super-loto/.github/workflows/general-nvidia-manual-lock.yml@refs/heads/main|xxlyusufi61-bot/general-super-loto/.github/workflows/general-agent.yml@refs/heads/main|xxlyusufi61-bot/general-super-loto/.github/workflows/general-autonomous-research.yml@refs/heads/main|xxlyusufi61-bot/general-super-loto/.github/workflows/general-coordinator-execute.yml@refs/heads/main|xxlyusufi61-bot/general-super-loto/.github/workflows/nvidia-chat-test.yml@refs/heads/main|xxlyusufi61-bot/general-super-loto/.github/workflows/nvidia-diagnostic.yml@refs/heads/main|xxlyusufi61-bot/general-super-loto/.github/workflows/nvidia-test.yml@refs/heads/main|xxlyusufi61-bot/general-super-loto/.github/workflows/open-research.yml@refs/heads/main)
              echo "SCOPED WRITER DEPLOYMENT GATE: emergency Main Writer safety-lock exception"
              exit 0
              ;;
            *)
              echo "::error::Pre-validation safety-lock exception is not allowed from this workflow."
              exit 1
              ;;
          esac
        fi
        echo "::error::Scoped writer operations are disabled until GENERAL_SCOPED_WRITERS_VALIDATED=true."
        echo "::error::Run the post-merge read-only App validation, verify all three branch Rulesets, then set the repository variable."
        exit 1
    - id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ github.repository_owner }}
        repositories: general-super-loto
        permission-contents: write
